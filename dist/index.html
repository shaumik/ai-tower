        vx: -Math.cos(e.angle) * 0.6, vy: -Math.sin(e.angle) * 0.6,
        life: 0.3, maxLife: 0.3, size: 2.4, color: def.color,
      });
    }
    const hurt = e.hp < e.maxHp * 0.3 && !e.stealthed;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(px, py);
    if (e.flying) ctx.translate(0, -T * 0.22 + Math.sin(e.anim * 4) * T * 0.05);
    else if (v.hover) { // hovering: slow vertical bob
      const amp = v.hover * dim;
      ctx.translate(0, -amp * 0.5 + Math.sin(e.anim * 3.1 + e.wobble) * amp * 0.5);
    } else if (v.bob) { // walkers: footfall bounce synced to the leg cycle
      ctx.translate(0, -Math.abs(Math.sin(cyc * Math.PI * 2)) * v.bob * dim);
    }
    const wob = Math.sin(e.anim * 6 + e.wobble) * 0.06 * (v.wob === undefined ? 1 : v.wob);
    ctx.rotate(e.angle + wob);
    const sc = 1 + (e.hitT > 0 ? e.hitT * 1.5 : 0);
    if (v.squish) { // gelatinous pulse
      const q = Math.sin(e.anim * 4 + e.wobble) * v.squish;
      ctx.scale(1 + q, 1 - q);
    }
    ctx.drawImage(spr, -dim / 2 * sc, -dim / 2 * sc, dim * sc, dim * sc);
    // live thruster flames (1 creature unit = dim/100 px); no shadowBlur here
    if (v.thr && !e.stealthed) {
      const k = dim / 100;
      const P = epal(def.color);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < v.thr.length; i++) {
        const tx2 = v.thr[i][0] * k, ty2 = v.thr[i][1] * k;
        const fl = (8 + 8 * Math.abs(Math.sin(now * 0.021 + e.wobble * 7 + i * 2.7))) * k;
        ctx.fillStyle = P.a(0.7);
        ctx.beginPath();
        ctx.moveTo(tx2, ty2 - 3.2 * k); ctx.lineTo(tx2, ty2 + 3.2 * k); ctx.lineTo(tx2 - fl, ty2);
        ctx.closePath(); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        ctx.beginPath();
        ctx.moveTo(tx2, ty2 - 1.5 * k); ctx.lineTo(tx2, ty2 + 1.5 * k); ctx.lineTo(tx2 - fl * 0.5, ty2);
        ctx.closePath(); ctx.fill();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    // heavy damage: dark cracks across the carapace
    if (hurt) {
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = Math.max(1, dim * 0.035);
      for (let i = 0; i < 2; i++) {
        const a0 = hash1(e.wobble * 10 + i * 7) * 6.28;
        const x0 = Math.cos(a0) * dim * 0.12, y0 = Math.sin(a0) * dim * 0.12;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x0 + Math.cos(a0 + 0.9) * dim * 0.14, y0 + Math.sin(a0 + 0.9) * dim * 0.14);
        ctx.lineTo(x0 + Math.cos(a0 + 0.4) * dim * 0.26, y0 + Math.sin(a0 + 0.4) * dim * 0.26);
        ctx.stroke();
      }
    }
    ctx.restore();
    // heavy damage: smoke wisps + sparks
    if (hurt && e.g.particles.length < 280) {
      if (Math.random() < 0.16) e.g.particles.push({
        x: e.x + (Math.random() - 0.5) * e.size, y: e.y + (Math.random() - 0.5) * e.size,
        vx: (Math.random() - 0.5) * 0.2, vy: -0.5 - Math.random() * 0.4,
        life: 0.55, maxLife: 0.55, size: 2.5 + Math.random() * 2, color: 'rgba(115,115,130,0.6)',
      });
      if (Math.random() < 0.1) e.g.particles.push({
        x: e.x, y: e.y, vx: (Math.random() - 0.5) * 2.4, vy: (Math.random() - 0.5) * 2.4,
        life: 0.25, maxLife: 0.25, size: 1.8, color: '#ffd166',
      });
    }
    // boss aura sparks
    if (e.isBoss && !e.stealthed && Math.random() < 0.2 && e.g.particles.length < 280) {
      const oa = Math.random() * Math.PI * 2;
      e.g.particles.push({
        x: e.x + Math.cos(oa) * e.size * 1.5, y: e.y + Math.sin(oa) * e.size * 1.5,
        vx: Math.cos(oa + 1.57) * 0.8, vy: Math.sin(oa + 1.57) * 0.8,
        life: 0.4, maxLife: 0.4, size: 2.2, color: e.def.color,
      });
    }
    // boss menace ring
    if (e.isBoss && !e.stealthed) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + Math.sin(now * 0.006) * 0.15;
      ctx.strokeStyle = e.def.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(px, py, dim * 0.72, now * 0.002, now * 0.002 + 4.4); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }

    // elite crown
    if (e.elite) {
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold ' + Math.round(T * 0.3) + 'px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('★', px, py - dim / 2 - T * 0.18);
    }
    // stun sparks
    if (e.stunT > 0) {
      ctx.strokeStyle = '#c86bff'; ctx.lineWidth = 1.5; ctx.globalAlpha = 0.9;
      for (let i = 0; i < 3; i++) {
        const a = now * 0.02 + i * 2.1;
        ctx.beginPath();
        ctx.moveTo(px + Math.cos(a) * dim * 0.5, py + Math.sin(a) * dim * 0.35);
        ctx.lineTo(px + Math.cos(a + 0.5) * dim * 0.65, py + Math.sin(a + 0.5) * dim * 0.45);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }

    // status pips: chilled / shocked / burning
    if (!e.stealthed && (e.chilledT > 0 || e.shockT > 0 || e.burnT > 0)) {
      ctx.globalCompositeOperation = 'lighter';
      let sxo = px - dim * 0.4;
      if (e.chilledT > 0) { ctx.fillStyle = '#7fdcff'; ctx.fillRect(sxo, py + dim / 2 + 2, 5, 5); sxo += 7; }
      if (e.shockT > 0)   { ctx.fillStyle = '#c86bff'; ctx.fillRect(sxo, py + dim / 2 + 2, 5, 5); sxo += 7; }
      if (e.burnT > 0)    { ctx.fillStyle = '#ff8a5c'; ctx.fillRect(sxo, py + dim / 2 + 2, 5, 5); }
      ctx.globalCompositeOperation = 'source-over';
    }

    // hp bar
    if (e.hp < e.maxHp && !e.stealthed) {
      const bw = Math.max(T * 0.5, dim * 0.8), bh = Math.max(3, T * 0.07);
      const bx = px - bw / 2, by = py - dim / 2 - bh - 3 - (e.flying ? T * 0.22 : 0);
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      const frac = UTIL.clamp(e.hp / e.maxHp, 0, 1);
      ctx.fillStyle = frac > 0.5 ? '#5be36b' : (frac > 0.25 ? '#ffc14d' : '#ff3d5f');
      ctx.fillRect(bx, by, bw * frac, bh);
      if (e.maxShield > 0 && e.shield > 0) {
        ctx.fillStyle = '#7fdcff';
        ctx.fillRect(bx, by - bh * 0.7 - 1, bw * UTIL.clamp(e.shield / e.maxShield, 0, 1), bh * 0.55);
      }
    }
  }

  function drawPlacement(g) {
    const lv = g.level;
    // tint buildable cells
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#2aa8ff';
    for (let y = 0; y < lv.rows; y++) for (let x = 0; x < lv.cols; x++) {
      if (g.cellFree(x, y)) ctx.fillRect(sx(x) + 1, sy(y) + 1, T - 2, T - 2);
    }
    ctx.globalAlpha = 1;
    // hovered cell preview
    if (g.placeCell) {
      const { x, y } = g.placeCell;
      const ok = g.cellFree(x, y) && g.cash >= g.towerCost(g.placingType);
      const def = DATA.TOWERS[g.placingType];
      const range = def.levels[0].range * T;
      ctx.fillStyle = ok ? 'rgba(80,255,160,0.10)' : 'rgba(255,60,90,0.12)';
      ctx.beginPath(); ctx.arc(sx(x + 0.5), sy(y + 0.5), range, 0, 7); ctx.fill();
      ctx.strokeStyle = ok ? 'rgba(80,255,160,0.75)' : 'rgba(255,60,90,0.8)';
      ctx.lineWidth = 1.6; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.arc(sx(x + 0.5), sy(y + 0.5), range, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
      ctx.strokeRect(sx(x) + 1.5, sy(y) + 1.5, T - 3, T - 3);
      // corner brackets on the candidate tile
      const bpx = sx(x + 0.5), bpy = sy(y + 0.5);
      const hb = T * 0.62, ln = T * 0.26;
      ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (const [cx2, cy2] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) {
        const bx = bpx + cx2 * hb, by = bpy + cy2 * hb;
        ctx.beginPath();
        ctx.moveTo(bx - cx2 * ln, by); ctx.lineTo(bx, by); ctx.lineTo(bx, by - cy2 * ln);
        ctx.stroke();
      }
      // ghost sprite
      ctx.globalAlpha = 0.75;
      const bs = towerBaseSprite(g.placingType, 0), hs = towerHeadSprite(g.placingType, 0);
      const szz = T * 1.06;
      ctx.drawImage(bs, sx(x + 0.5) - szz / 2, sy(y + 0.5) - szz / 2, szz, szz);
      ctx.drawImage(hs, sx(x + 0.5) - szz / 2, sy(y + 0.5) - szz / 2, szz, szz);
      ctx.globalAlpha = 1;
    }
  }

  return { setup, resize, frame, screenToCell, screenToWorld, cellToScreen, paintTowerIcon, paintEnemyIcon, get T() { return T; }, get boardBottom() { return boardBottom; } };
})();
</script>
<script>
/* ====================== js/game.js ====================== */
/* NEURAL SIEGE — core game state machine & loop */
'use strict';
const GAME = (function () {

  const g = {
    active: false,
    level: null, levelN: 1, diff: 'standard', diffDef: DATA.DIFFS[0], endless: false,
    phase: 'build',          // build | combat | won | lost
    wave: 1, totalWaves: 10,
    cash: 0, lives: 20, maxLives: 20,
    towers: [], enemies: [], projectiles: [], fx: [], particles: [],
    spawnQueue: [], spawnT: 0,
    pathLen: 1, grid: {}, bountyMult: 1,
    speed: 1, paused: false,
    placingType: null, placeCell: null, selectedTower: null,
    shakeT: 0, shakeMag: 0,
    bossEnemy: null,
    stats: { kills: 0, leaked: 0, built: 0 },
    seenThisRun: {},
    time: 0,
    // fun systems
    energy: 30, surgeT: 0, abilityTarget: null,
    chips: [], chipChoices: [],
    combo: 0, comboT: 0, comboPeak: 0, waveLeaks: 0,
    rushBase: 0, rushT: 0,
    burns: [], texts: [],
    curEvent: null, evSpeedMult: 1, evRegen: 0, evComboMult: 1,
    slowmoT: 0, endDelay: 0, hurtT: 0, autoT2: 0,
  };

  let rafId = null, lastT = 0;

  // ================================================================ SETUP
  function start(levelN, diff, endless) {
    g.levelN = levelN;
    g.diff = diff || 'standard';
    g.diffDef = DATA.DIFFS.find(d => d.id === g.diff) || DATA.DIFFS[0];
    g.endless = !!endless;
    g.level = MAPS.level(levelN);
    g.phase = 'build';
    g.wave = 1;
    g.totalWaves = g.level.waves;
    g.cash = g.level.startCash + SAVE.researchValue('capital');
    g.maxLives = g.level.lives + SAVE.researchValue('integrity');
    g.lives = g.maxLives;
    g.towers = []; g.enemies = []; g.projectiles = []; g.fx = []; g.particles = [];
    g.spawnQueue = [];
    g.grid = {};
    g.speed = 1; g.paused = false;
    g.placingType = null; g.placeCell = null; g.selectedTower = null;
    g.bossEnemy = null;
    g.stats = { kills: 0, leaked: 0, built: 0 };
    g.seenThisRun = {};
    g.time = 0;
    g.energy = 30; g.surgeT = 0; g.abilityTarget = null;
    g.chips = []; g.chipChoices = [];
    g.combo = 0; g.comboT = 0; g.comboPeak = 0; g.waveLeaks = 0;
    g.rushBase = 0; g.rushT = 0;
    g.burns = []; g.texts = [];
    g.curEvent = null; g.evSpeedMult = 1; g.evRegen = 0; g.evComboMult = 1;
    g.slowmoT = 0; g.endDelay = 0; g.hurtT = 0; g.autoT2 = 0;
    g.perfectStreak = 0; g.perfectWaves = 0; g.bestCombo = 0; g.dangerT = 0; g.alarmT = 0;
    g.tiles = {}; g.corrupt = {};
    g.deal = null; g.dealAccepted = null; g.insured = false; g.bargainMult = 1;
    g.fork = null; g.forkPick = null;

    // offer 1-of-3 protocol chips, seeded per attempt
    SAVE.state.stats.attempts = (SAVE.state.stats.attempts || 0) + 1;
    SAVE.persist();
    const cr = UTIL.rng(0xC419 + levelN * 733 + SAVE.state.stats.attempts * 97);
    const pool = DATA.CHIPS.filter(c => c.id !== 'capacitor' || levelN >= 4); // abilities exist from L4
    const picks = [];
    while (picks.length < 3 && picks.length < pool.length) {
      const c = pool[Math.floor(cr() * pool.length)];
      if (!picks.includes(c)) picks.push(c);
    }
    g.chipChoices = picks;
    g.pathLen = g.level.path.length - 1;
    for (const b of g.level.blocks) g.grid[b.x + ',' + b.y] = 'block';
    for (const p of g.level.path) g.grid[p.x + ',' + p.y] = 'path';
    for (const t of (g.level.tiles || [])) {
      if (t.kind === 'dead') g.grid[t.x + ',' + t.y] = 'block';
      else g.tiles[t.x + ',' + t.y] = t.kind;
    }
    g.active = true;

    RENDER.resize(g);
    UI.enterGame();
    UI.updateHUD();
    UI.phaseBanner('DEPLOY PHASE — WAVE 1 INCOMING', false);
    UI.showChipPicker(g.chipChoices);

    // new tower unlocks at this level
    const newT = MAPS.newTowersAt(levelN);
    if (newT.length) setTimeout(() => UI.toast('NEW DEFENSE UNLOCKED: ' + DATA.TOWERS[newT[0]].name.toUpperCase(), 'warn'), 900);

    if (!rafId) { lastT = performance.now(); rafId = requestAnimationFrame(loop); }
  }

  function quit() {
    g.active = false;
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  }

  // ================================================================ GRID
  function cellFree(x, y) {
    const lv = g.level;
    if (x < 0 || y < 0 || x >= lv.cols || y >= lv.rows) return false;
    return !g.grid[x + ',' + y] && !g.corrupt[x + ',' + y];
  }
  function tileAt(x, y) { return g.tiles[x + ',' + y] || null; }
  function towerAt(x, y) {
    const v = g.grid[x + ',' + y];
    return (v && v instanceof Tower) ? v : null;
  }

  function pointAt(d) {
    const path = g.level.path;
    d = UTIL.clamp(d, 0, g.pathLen - 0.0001);
    const i = Math.min(path.length - 2, Math.floor(d));
    const f = d - i;
    return {
      x: UTIL.lerp(path[i].x, path[i + 1].x, f) + 0.5,
      y: UTIL.lerp(path[i].y, path[i + 1].y, f) + 0.5,
    };
  }

  // ================================================================ CHIPS
  function chipHas(id) { return g.chips.indexOf(id) >= 0; }
  function pickChip(id) {
    g.chips.push(id);
    if (id === 'warchest') g.cash += 180;
    if (id === 'plating') { g.maxLives += 6; g.lives += 6; }
    UI.updateHUD();
  }

  // ================================================================ ECONOMY
  function towerCost(type) {
    let c = DATA.TOWERS[type].levels[0].cost * (1 - SAVE.researchValue('discount') / 100);
    if (chipHas('fab')) c *= 0.88;
    return Math.round(c);
  }

  function placeTower(type, x, y) {
    if (g.phase !== 'build') { UI.toast('CANNOT BUILD DURING A WAVE', 'warn'); AUDIO.sfx.error(); return false; }
    if (!cellFree(x, y)) { AUDIO.sfx.error(); return false; }
    if (g.diffDef.towerCap && g.towers.length >= g.diffDef.towerCap) {
      UI.toast('CAPACITY ' + g.diffDef.towerCap + ' REACHED — SELL TO REBUILD', 'warn');
      AUDIO.sfx.error(); return false;
    }
    const cost = towerCost(type);
    if (g.cash < cost) { UI.toast('INSUFFICIENT CREDITS', 'warn'); AUDIO.sfx.error(); return false; }
    g.cash -= cost;
    const tw = new Tower(g, type, x, y);
    tw.invested = cost;
    tw.fresh = true; // full refund until first wave it fights
    g.towers.push(tw);
    g.grid[x + ',' + y] = tw;
    recomputeBuffs();
    g.stats.built++;
    SAVE.addStat('towersBuilt', 1);
    AUDIO.sfx.build();
    fxRing(x + 0.5, y + 0.5, 0.6, DATA.TOWERS[type].color);
    UI.updateHUD();
    return true;
  }

  function upgradeTower(tw, branchIdx) {
    if (g.phase !== 'build') { UI.toast('CANNOT UPGRADE DURING A WAVE', 'warn'); AUDIO.sfx.error(); return false; }
    const cost = tw.upgradeCost();
    if (cost === null || g.cash < cost) { AUDIO.sfx.error(); return false; }
    // final tier is a specialization: a branch must be chosen
    if (tw.tier === 2 && DATA.BRANCHES[tw.type] && branchIdx === undefined) { AUDIO.sfx.error(); return false; }
    g.cash -= cost;
    tw.invested += cost;
    tw.tier++;
    if (tw.tier === 3 && branchIdx !== undefined) tw.branch = branchIdx;
    recomputeBuffs();
    SAVE.addStat('upgradesBought', 1);
    if (tw.tier >= 3) SAVE.maxStat('maxTier', 1);
    AUDIO.sfx.upgrade();
    fxRing(tw.x, tw.y, 0.75, '#ffd166');
    UI.updateHUD();
    return true;
  }

  function sellTower(tw) {
    if (g.phase !== 'build') { UI.toast('CANNOT SELL DURING A WAVE', 'warn'); AUDIO.sfx.error(); return false; }
    const refund = tw.fresh ? tw.invested : tw.sellValue();
    g.cash += refund;
    g.towers.splice(g.towers.indexOf(tw), 1);
    delete g.grid[tw.gx + ',' + tw.gy];
    if (g.selectedTower === tw) g.selectedTower = null;
    recomputeBuffs();
    AUDIO.sfx.sell();
    UI.updateHUD();
    return true;
  }

  function recomputeBuffs() {
    for (const tw of g.towers) { tw.buffDmg = 0; tw.buffRate = 0; }
    for (const oc of g.towers) {
      if (oc.def.kind !== 'buffaura') continue;
      const s = oc.stats(); // includes branch bonuses
      for (const tw of g.towers) {
        if (tw === oc || tw.def.kind === 'buffaura' || tw.def.kind === 'income') continue;
        if (UTIL.dist2(oc.x, oc.y, tw.x, tw.y) <= s.range * s.range) {
          tw.buffDmg = Math.max(tw.buffDmg, s.buffDmg);
          tw.buffRate = Math.max(tw.buffRate, s.buffRate);
        }
      }
    }
  }

  // slow aura from throttle towers at a world point
  function auraSlowAt(x, y) {
    let slow = 0;
    for (const tw of g.towers) {
      if (tw.def.kind !== 'slowaura' || tw.disabledT > 0) continue;
      const s = tw.stats(); // includes branch + cryo chip
      if (UTIL.dist2(tw.x, tw.y, x, y) <= s.range * s.range) slow = Math.max(slow, s.slow);
    }
    return slow;
  }

  // ================================================================ WAVES
  function startWave() {
    if (g.phase !== 'build') return;
    // rush bonus: the sooner you start, the more you bank
    if (g.rushT > 0 && g.rushBase > 0) {
      const bonus = Math.ceil(g.rushBase * (g.rushT / 22));
      if (bonus > 0) { g.cash += bonus; UI.toast('RUSH BONUS +¤' + bonus, 'warn'); AUDIO.sfx.cash(); }
    }
    g.rushT = 0; g.rushBase = 0;

    const w = WAVES.build(g.levelN, g.wave, g.totalWaves, g.diff, g.forkPick);
    g.bountyMult = w.bounty * (1 + SAVE.researchValue('bounty') / 100) * (chipHas('bounty') ? 1.2 : 1);
    // apply accepted deals for this wave
    g.bargainMult = g.dealAccepted === 'bargain' ? 1.35 : 1;
    g.deal = null; g.dealAccepted = g.dealAccepted === 'bargain' ? null : g.dealAccepted;
    g.fork = null; g.forkPick = null;
    g.spawnQueue = w.events.slice();
    g.spawnT = 0;
    g.phase = 'combat';
    g.waveLeaks = 0; g.combo = 0; g.comboPeak = 0;
    for (const tw of g.towers) tw.fresh = false;
    g.placingType = null; g.placeCell = null;

    // wave event
    g.curEvent = w.event || null;
    g.evSpeedMult = 1; g.evRegen = 0; g.evComboMult = 1;
    if (g.curEvent) {
      const ev = DATA.EVENTS[g.curEvent];
      if (ev.speed) g.evSpeedMult = ev.speed;
      if (ev.regen) g.evRegen = ev.regen;
      if (ev.comboMult) g.evComboMult = ev.comboMult;
      if (ev.blackout && g.towers.length) {
        const victims = g.towers.filter(t => t.def.kind !== 'income');
        if (victims.length) {
          const v = victims[Math.floor(Math.random() * victims.length)];
          v.disabledT = 9999;
          fxRing(v.x, v.y, 0.8, '#ff3d71');
        }
      }
      UI.phaseBanner(ev.ico + ' ' + ev.name + ' — ' + ev.desc, true);
    } else if (w.formation) {
      const f = WAVES.formationInfo(w.formation);
      UI.phaseBanner(f.ico + ' ' + f.name + ' — ' + f.desc, true);
    } else {
      UI.phaseBanner('WAVE ' + g.wave + (g.wave > g.totalWaves ? ' — OVERTIME' : ''), false);
    }
    g.fx.push({ kind: 'sweep', ttl: 0.9, t: 0.9 });
    UI.closeSheets();
    UI.updateHUD();
    AUDIO.sfx.waveStart();
  }

  function endWave() {
    // clear event effects
    g.curEvent = null; g.evSpeedMult = 1; g.evRegen = 0; g.evComboMult = 1;
    for (const tw of g.towers) tw.disabledT = 0;
    g.burns = [];

    // payouts
    let income = WAVES.waveEndBonus(g.levelN, g.wave);
    let interestPct = SAVE.researchValue('interest') + (chipHas('interest') ? 3 : 0);
    for (const tw of g.towers) {
      if (tw.def.kind === 'income') {
        const s = tw.stats();
        income += s.income;
        interestPct += s.interest || 0;
      }
    }
    const interest = Math.floor(g.cash * Math.min(8, interestPct) / 100);
    g.cash += income + interest;

    // perfect wave streak: consecutive clean waves compound the payout
    if (g.waveLeaks === 0 && g.stats.kills > 0) {
      g.perfectStreak++;
      g.perfectWaves++;
      const perfect = Math.round((8 + g.wave + g.levelN) * (1 + 0.25 * Math.min(4, g.perfectStreak - 1)));
      g.cash += perfect;
      UI.toast('★ PERFECT' + (g.perfectStreak > 1 ? ' ×' + g.perfectStreak : '') + ' +¤' + perfect, 'warn');
    } else if (g.waveLeaks > 0) {
      g.perfectStreak = 0;
    }
    if (chipHas('medic') && g.lives < g.maxLives) g.lives++;
    SAVE.addStat('cashEarned', income + interest);
    SAVE.maxStat('maxCash', g.cash);
    SAVE.addStat('wavesCleared', 1);
    AUDIO.sfx.waveClear();

    g.bestCombo = Math.max(g.bestCombo || 0, g.comboPeak);
    const clearedWave = g.wave;
    g.wave++;
    g.bossEnemy = null;
    UI.bossBar(null);

    if (g.endless) {
      const over = clearedWave - g.totalWaves;
      SAVE.maxStat('endlessBestAny', clearedWave);
      const rec = SAVE.levelRec(g.levelN);
      if (clearedWave > rec.endlessBest) { rec.endlessBest = clearedWave; SAVE.persist(); }
      if (over > 0 && over % 5 === 0) {
        const bonus = g.diffDef.coreMult;
        SAVE.state.cores += bonus; SAVE.persist();
        UI.toast('+' + bonus + ' ◈ DATA CORES (ENDLESS)', 'warn');
      }
    } else if (clearedWave >= g.totalWaves) {
      return victory();
    }

    g.phase = 'build';
    g.rushBase = 18 + g.wave * 5 + g.levelN * 2;
    g.rushT = 22;
    g.insured = false; g.dealAccepted = null; g.bargainMult = 1;

    // pre-wave content roll (seeded): fork the wave, or a deal
    const pr = UTIL.rng(0xD1CE + g.levelN * 811 + g.wave * 53);
    g.fork = null; g.deal = null;
    if (g.wave <= g.totalWaves) {
      const roll = pr();
      if (roll < 0.22 && g.wave >= 3 && !DATA.BOSS_LEVELS[g.levelN] || (roll < 0.22 && g.wave < g.totalWaves)) {
        const keys = ['rush', 'horde', 'siege', 'airraid', 'phantom'];
        const a = keys[Math.floor(pr() * keys.length)];
        let b = keys[Math.floor(pr() * keys.length)];
        if (b === a) b = keys[(keys.indexOf(a) + 1 + Math.floor(pr() * 3)) % keys.length];
        g.fork = [a, b];
      } else if (roll < 0.50 && g.wave >= 3) {
        if (pr() < 0.5) {
          g.deal = { id: 'bargain', gain: 110 + g.wave * 16 + g.levelN * 6 };
        } else {
          g.deal = { id: 'insurance', cost: 45 + g.wave * 10 };
        }
      }
    }
    // corruption: seeds at wave 5, spreads every wave-end until purged
    const ck = Object.keys(g.corrupt);
    if (ck.length) {
      for (const key of ck) {
        const [cx, cy] = key.split(',').map(Number);
        const opts2 = [[1, 0], [-1, 0], [0, 1], [0, -1]]
          .map(([dx, dy]) => [cx + dx, cy + dy])
          .filter(([x, y]) => cellFree(x, y) && !tileAt(x, y));
        if (opts2.length) {
          const [nx, ny] = opts2[Math.floor(pr() * opts2.length)];
          g.corrupt[nx + ',' + ny] = 1;
          break; // one spread per wave total
        }
      }
      UI.toast('⚠ CORRUPTION SPREADING — ' + Object.keys(g.corrupt).length + ' TILES', 'warn');
    } else if (g.wave === 5 || (g.wave > 5 && g.wave % 7 === 0 && pr() < 0.5)) {
      const lv = g.level;
      let guard = 0;
      while (guard++ < 80) {
        const x = Math.floor(pr() * lv.cols), y = 1 + Math.floor(pr() * (lv.rows - 2));
        if (cellFree(x, y) && !tileAt(x, y)) {
          g.corrupt[x + ',' + y] = 1;
          UI.toast('⚠ TILE CORRUPTED — PURGE BEFORE IT SPREADS', 'warn');
          AUDIO.sfx.newThreat();
          break;
        }
      }
    }
    UI.phaseBanner('WAVE CLEARED  ·  +' + UTIL.fmt(income + interest) + ' ¤  ·  DEPLOY PHASE', false);
    UI.updateHUD();
    UI.checkAchToasts();

    if (SAVE.state.settings.autostart) {
      g.autoT = 3;
    }
  }

  function victory() {
    g.phase = 'won';
    const fracLives = g.lives / g.maxLives;
    const stars = g.lives >= g.maxLives * 0.9 ? 3 : (fracLives >= 0.5 ? 2 : 1);
    g.grade = g.stats.leaked === 0 ? 'S' : (fracLives >= 0.9 ? 'A' : (fracLives >= 0.55 ? 'B' : 'C'));
    const prev = SAVE.starsFor(g.levelN, g.diff);
    let cores = Math.round((2 + g.levelN * 0.3) * g.diffDef.coreMult) + (stars - 1);
    if (g.grade === 'S') cores = Math.round(cores * 1.3); // flawless pays extra
    if (stars <= prev) cores = Math.max(1, Math.round(cores * 0.2)); // repeat clears pay less
    SAVE.recordWin(g.levelN, g.diff, stars, cores);
    if (g.stats.leaked === 0) SAVE.addStat('perfectWins', 1);
    if (g.diff === 'insane') SAVE.addStat('insaneWins', 1);
    AUDIO.sfx.victory();
    UI.showEnd(true, stars, cores);
    UI.checkAchToasts();
  }

  function defeat() {
    g.phase = 'lost';
    AUDIO.sfx.defeat();
    UI.showEnd(false, 0, 0);
  }

  // ================================================================ SPAWN & COMBAT
  function spawnEnemy(type, hpMult, opts) {
    const e = new Enemy(g, type, hpMult * (g.bargainMult || 1), opts);
    if (g.evSpeedMult !== 1) e.baseSpeed *= g.evSpeedMult;
    if (g.evRegen) e.regenBonus = g.evRegen * hpMult;
    g.enemies.push(e);
    if (e.isBoss) {
      g.bossEnemy = e; UI.bossBar(e);
      if (e.traits.boss) {
        g.fx.push({ kind: 'flash', ttl: 0.3, t: 0.3, color: '#ff3d71' });
        shake(7);
      } else {
        UI.phaseBanner('⚠ ' + (e.displayName || e.def.name), true);
        shake(4);
      }
    }
    if (!SAVE.state.seenEnemies[type] && !g.seenThisRun[type]) {
      g.seenThisRun[type] = true;
      SAVE.markSeen(type);
      const def = DATA.ENEMIES[type];
      if (!def.nopool || def.traits && def.traits.boss) {
        UI.phaseBanner('NEW THREAT: ' + def.name.toUpperCase(), true);
        AUDIO.sfx.newThreat();
      }
    }
    return e;
  }

  function onEnemyKilled(e, source) {
    // combo: kills in quick succession pay extra
    g.combo++;
    g.comboT = 1.6;
    if (g.combo > g.comboPeak) g.comboPeak = g.combo;
    const comboBonus = Math.min(0.35, g.combo * 0.01) * g.evComboMult;
    if (e.bounty) { g.cash += Math.round(e.bounty * (1 + comboBonus)); }
    // ability energy from kills
    g.energy = Math.min(100, g.energy + 1 + (e.def.threat || 2) * 0.05);
    g.stats.kills++;
    SAVE.addStat('kills', 1);
    if (source instanceof Tower) source.kills++;
    // shatter burst
    fxHit(e.x, e.y, e.def.color, e.isBoss ? 30 : 10);
    fxRing(e.x, e.y, e.size * 1.6, e.def.color);
    // BURNING enemies detonate: fire spreads to neighbors
    if (e.burnT > 0 && !e.flying) {
      const burst = Math.min(60, e.maxHp * 0.05);
      for (const o of g.enemies) {
        if (o.dead || o === e || o.flying || o.y < 0) continue;
        if (UTIL.dist2(e.x, e.y, o.x, o.y) <= 1.21) {
          o.hurt(burst, { noArmor: true });
          o.burnT = Math.max(o.burnT, 1);
        }
      }
      fxBoom(e.x, e.y, 0.7, '#ff8a5c');
    }
    // final kill of the wave: slow-mo finish
    if (g.phase === 'combat' && !g.spawnQueue.length) {
      let alive = 0;
      for (const o of g.enemies) if (!o.dead && o !== e) alive++;
      if (alive === 0) g.slowmoT = 0.55;
    }
    if (e.traits.boss) {
      SAVE.addStat('bossKills', 1);
      shake(9);
      AUDIO.sfx.bossDie();
      UI.bossBar(null);
    } else if (e.isBoss) {
      // mini-boss down
      shake(5);
      AUDIO.sfx.bossDie();
      UI.bossBar(null);
      fxText(e.x, e.y, '+¤' + e.bounty, '#ffd166', true);
    } else {
      AUDIO.sfx.die();
    }
    // death traits
    const tr = e.traits;
    if (tr.spawnOnDeath) {
      for (let i = 0; i < tr.spawnOnDeath.count; i++) {
        spawnEnemy(tr.spawnOnDeath.type, e.hpMult, { dist: Math.max(0, e.dist - 0.15 * i) });
      }
    }
    if (tr.split) {
      for (let i = 0; i < tr.split.count; i++) {
        spawnEnemy(tr.split.type, e.hpMult, { dist: Math.max(0, e.dist - 0.2 * i) });
      }
    }
    UI.updateHUD();
  }

  function onLeak(e) {
    if (g.insured) {
      g.waveLeaks++;
      UI.toast('⛨ LEAK INSURED', 'warn');
      fxText(e.x, e.y, 'INSURED', '#7fdcff', false);
      return;
    }
    g.lives -= e.dmg;
    g.stats.leaked++;
    g.waveLeaks++;
    g.hurtT = 0.5;
    SAVE.addStat('leaks', 1);
    if (e.traits.leech) {
      g.cash = Math.max(0, g.cash - e.traits.leech);
      UI.toast('-' + e.traits.leech + ' ¤ SIPHONED', 'warn');
    }
    if (e.isBoss) UI.bossBar(null);
    shake(e.isBoss ? 10 : 4);
    AUDIO.sfx.leak();
    UI.hurtFlash();
    UI.updateHUD();
    if (g.lives <= 0) defeat();
  }

  // ================================================================ FX
  function fxLine(x1, y1, x2, y2, color, ttl, zig) {
    g.fx.push({ kind: 'line', x1, y1, x2, y2, color, ttl, t: ttl, zig });
  }
  function fxRing(x, y, r, color) {
    g.fx.push({ kind: 'ring', x, y, r, color, ttl: 0.4, t: 0.4 });
  }
  function fxBoom(x, y, r, color) {
    g.fx.push({ kind: 'boom', x, y, r, color, ttl: 0.35, t: 0.35 });
    fxHit(x, y, color, 10);
    if (g.particles.length < 270) {
      for (let i = 0; i < 5; i++) { // rising smoke
        g.particles.push({
          x: x + (Math.random() - 0.5) * r, y: y + (Math.random() - 0.5) * r,
          vx: (Math.random() - 0.5) * 0.4, vy: -0.6 - Math.random() * 0.8,
          life: 0.55 + Math.random() * 0.3, maxLife: 0.85, size: 4 + Math.random() * 4, color: 'rgba(150,150,160,0.5)',
        });
      }
      for (let i = 0; i < 6; i++) { // hot debris
        const a = Math.random() * Math.PI * 2, sp = 2.5 + Math.random() * 3;
        g.particles.push({
          x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
          life: 0.35 + Math.random() * 0.2, maxLife: 0.55, size: 2, color: '#fff2cc',
        });
      }
    }
  }
  function fxHit(x, y, color, n) {
    if (g.particles.length > 260) return;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.6;
      g.particles.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0.3 + Math.random() * 0.35, maxLife: 0.55,
        size: 2 + Math.random() * 3, color,
      });
    }
  }
  function shake(mag) { g.shakeT = 0.3; g.shakeMag = mag; }

  function fxText(x, y, txt, color, big) {
    if (g.texts.length > 24) g.texts.shift();
    g.texts.push({ x, y, txt: String(txt), color: color || '#fff', big: !!big, t: 0.9, ttl: 0.9 });
  }
  function addBurn(x, y, r, dps, dur) {
    if (g.burns.length > 12) g.burns.shift();
    g.burns.push({ x, y, r, dps, t: dur });
  }

  // ================================================================ DEALS / CORRUPTION / FORK
  function acceptDeal() {
    if (!g.deal || g.phase !== 'build') return false;
    if (g.deal.id === 'bargain') {
      g.cash += g.deal.gain;
      g.dealAccepted = 'bargain';
      UI.toast("DEVIL'S BARGAIN: +¤" + g.deal.gain + ' — NEXT WAVE +35%', 'warn');
      AUDIO.sfx.cash();
    } else if (g.deal.id === 'insurance') {
      if (g.cash < g.deal.cost) { AUDIO.sfx.error(); return false; }
      g.cash -= g.deal.cost;
      g.insured = true;
      g.dealAccepted = 'insurance';
      UI.toast('⛨ INSURED — LEAKS COST NO INTEGRITY THIS WAVE', 'warn');
      AUDIO.sfx.build();
    }
    g.deal = null;
    UI.updateHUD();
    return true;
  }
  function purgeCost() { return 40 + 30 * Math.max(0, Object.keys(g.corrupt).length - 1); }
  function purgeCorruption() {
    const n = Object.keys(g.corrupt).length;
    if (!n || g.phase !== 'build') return false;
    const cost = purgeCost();
    if (g.cash < cost) { AUDIO.sfx.error(); UI.toast('NEED ¤' + cost + ' TO PURGE', 'warn'); return false; }
    g.cash -= cost;
    for (const key of Object.keys(g.corrupt)) {
      const [x, y] = key.split(',').map(Number);
      fxRing(x + 0.5, y + 0.5, 0.6, '#c86bff');
    }
    g.corrupt = {};
    UI.toast('CORRUPTION PURGED', 'warn');
    AUDIO.sfx.waveClear();
    UI.updateHUD();
    return true;
  }
  function pickFork(idx) {
    if (!g.fork || g.phase !== 'build') return;
    g.forkPick = g.fork[idx];
    AUDIO.sfx.click();
    UI.updateHUD();
  }

  // ================================================================ ABILITIES
  function abilityCost(key) {
    const c = DATA.ABILITIES[key].cost;
    return Math.round(c * (chipHas('capacitor') ? 0.7 : 1));
  }
  function abilityReady(key) {
    return g.levelN >= DATA.ABILITIES[key].unlock && g.energy >= abilityCost(key);
  }
  function castAbility(key) {
    if (!abilityReady(key)) { AUDIO.sfx.error(); return false; }
    if (key === 'strike') {
      // enters targeting mode; energy spent on impact
      g.abilityTarget = g.abilityTarget === 'strike' ? null : 'strike';
      UI.refreshAbilities();
      AUDIO.sfx.click();
      return true;
    }
    g.energy -= abilityCost(key);
    if (key === 'surge') {
      g.surgeT = 6;
      fxRing(g.level.cols / 2, g.level.rows / 2, 3, '#ffe07a');
      UI.toast('⚡ OVERCLOCK SURGE', 'warn');
      AUDIO.sfx.upgrade();
      shake(4);
    } else if (key === 'patch') {
      g.lives = Math.min(g.maxLives, g.lives + 4);
      UI.toast('✚ CORE PATCHED +4', 'warn');
      AUDIO.sfx.waveClear();
    }
    UI.updateHUD(); UI.refreshAbilities();
    return true;
  }
  function doStrike(x, y) {
    if (!abilityReady('strike')) { g.abilityTarget = null; UI.refreshAbilities(); return; }
    g.energy -= abilityCost('strike');
    g.abilityTarget = null;
    const dmg = 130 * (1 + 0.09 * g.levelN);
    const r = 1.8;
    for (const e of g.enemies) {
      if (e.dead || e.y < 0) continue;
      if (UTIL.dist2(x, y, e.x, e.y) <= (r + e.size) * (r + e.size)) {
        e.hurt(dmg, { pierce: true, source: null });
        if (!e.dead) e.applyStun(0.8);
      }
    }
    fxBoom(x, y, r, '#ffd166');
    fxRing(x, y, r * 1.3, '#fff');
    fxText(x, y, 'ORBITAL STRIKE', '#ffd166', true);
    shake(9);
    AUDIO.sfx.bossDie();
    UI.updateHUD(); UI.refreshAbilities();
  }
  function autocast() {
    if (!SAVE.state.settings.autocast || g.phase !== 'combat') return;
    let alive = 0;
    for (const e of g.enemies) if (!e.dead && e.y > 0) alive++;
    if (g.levelN >= 12 && g.lives <= g.maxLives * 0.6 && abilityReady('patch')) { castAbility('patch'); return; }
    if (g.levelN >= 8 && alive >= 10 && abilityReady('surge') && g.surgeT <= 0) { castAbility('surge'); return; }
    if (g.levelN >= 4 && alive >= 6 && abilityReady('strike')) {
      // densest cluster: enemy with most neighbors within 1.5 tiles
      let best = null, bestN = 2;
      for (const e of g.enemies) {
        if (e.dead || e.y < 0) continue;
        let n = 0;
        for (const o of g.enemies) if (!o.dead && o.y > 0 && UTIL.dist2(e.x, e.y, o.x, o.y) < 2.25) n++;
        if (n > bestN) { bestN = n; best = e; }
      }
      if (best) doStrike(best.x, best.y);
    }
  }

  // ================================================================ LOOP
  function loop(now) {
    rafId = g.active ? requestAnimationFrame(loop) : null;
    if (!g.active) return;
    let dt = Math.min(0.1, (now - lastT) / 1000);
    lastT = now;
    if (!g.paused && (g.phase === 'combat' || g.phase === 'build')) {
      let simDt = dt * g.speed;
      if (g.slowmoT > 0) { simDt *= 0.3; g.slowmoT -= dt; } // cinematic last-kill
      while (simDt > 0) {
        const step = Math.min(simDt, 1 / 30);
        update(step);
        simDt -= step;
      }
    }
    RENDER.frame(g, now);
  }

  function update(dt) {
    g.time += dt;

    if (g.phase === 'build') {
      // idle animations only; optional autostart countdown
      if (g.autoT !== undefined && g.autoT > 0) {
        g.autoT -= dt;
        if (g.autoT <= 0) { delete g.autoT; startWave(); }
      }
      if (g.rushT > 0) g.rushT -= dt;
      tickFx(dt);
      return;
    }

    // spawner
    g.spawnT += dt;
    while (g.spawnQueue.length && g.spawnQueue[0].delay <= g.spawnT) {
      const ev = g.spawnQueue.shift();
      spawnEnemy(ev.type, ev.hpMult, { elite: ev.elite, mini: ev.mini });
    }

    // enemy aura buffs (botnet nodes)
    for (const e of g.enemies) e.auraSpeed = 0;
    for (const src of g.enemies) {
      if (src.dead || !src.traits.aura) continue;
      const au = src.traits.aura;
      for (const e of g.enemies) {
        if (e === src || e.dead) continue;
        if (UTIL.dist2(src.x, src.y, e.x, e.y) <= au.range * au.range) {
          e.auraSpeed = Math.max(e.auraSpeed, au.speed);
        }
      }
    }

    // scanners reveal stealth
    for (const tw of g.towers) {
      if (!tw.def.reveals) continue;
      const range = tw.def.levels[tw.tier].range;
      for (const e of g.enemies) {
        if (e.dead || (!e.traits.stealth && !e.traits.phaser)) continue;
        if (UTIL.dist2(tw.x, tw.y, e.x, e.y) <= (range + 0.4) * (range + 0.4)) {
          e.revealT = Math.max(e.revealT, 0.35);
          e.phaseHidden = false;
        }
      }
    }

    // entities
    for (const e of g.enemies) if (!e.dead) e.update(dt);
    for (const tw of g.towers) tw.update(dt);
    for (const p of g.projectiles) if (!p.dead) p.update(dt);

    // cull + leaks
    for (let i = g.enemies.length - 1; i >= 0; i--) {
      const e = g.enemies[i];
      if (e.dead) {
        if (e.leaked) onLeak(e);
        g.enemies.splice(i, 1);
      }
    }
    for (let i = g.projectiles.length - 1; i >= 0; i--) {
      if (g.projectiles[i].dead) g.projectiles.splice(i, 1);
    }

    // combo decay / surge timer / burn fields / autocast
    if (g.comboT > 0) { g.comboT -= dt; if (g.comboT <= 0) g.combo = 0; }
    if (g.surgeT > 0) g.surgeT -= dt;
    for (let i = g.burns.length - 1; i >= 0; i--) {
      const b = g.burns[i];
      b.t -= dt;
      if (b.t <= 0) { g.burns.splice(i, 1); continue; }
      for (const e of g.enemies) {
        if (e.dead || e.flying || e.y < 0) continue;
        if (UTIL.dist2(b.x, b.y, e.x, e.y) <= b.r * b.r) {
          e.hurt(b.dps * dt, { noArmor: true });
          e.burnT = Math.max(e.burnT, 0.6); // BURNING status
        }
      }
    }
    g.autoT2 -= dt;
    if (g.autoT2 <= 0) { g.autoT2 = 0.8; autocast(); }

    // near-miss alarm: something is in the final stretch
    let danger = false;
    for (const e of g.enemies) {
      if (!e.dead && e.y > 0 && e.dist / e.totalLen > 0.85) { danger = true; break; }
    }
    if (danger) {
      g.dangerT = 0.35;
      g.alarmT -= dt;
      if (g.alarmT <= 0) { g.alarmT = 0.9; AUDIO.sfx.alarm(); }
    } else if (g.dangerT > 0) g.dangerT -= dt;

    tickFx(dt);

    if (g.phase === 'combat' && !g.spawnQueue.length && !g.enemies.length) {
      g.endDelay += dt;
      if (g.endDelay > 0.45) { g.endDelay = 0; endWave(); }
    } else {
      g.endDelay = 0;
    }
  }

  function tickFx(dt) {
    if (g.shakeT > 0) g.shakeT -= dt;
    if (g.hurtT > 0) g.hurtT -= dt;
    for (let i = g.texts.length - 1; i >= 0; i--) {
      const tx = g.texts[i];
      tx.t -= dt;
      tx.y -= dt * 0.6;
      if (tx.t <= 0) g.texts.splice(i, 1);
    }
    for (let i = g.fx.length - 1; i >= 0; i--) {
      g.fx[i].t -= dt;
      if (g.fx[i].t <= 0) g.fx.splice(i, 1);
    }
    for (let i = g.particles.length - 1; i >= 0; i--) {
      const p = g.particles[i];
      p.life -= dt;
      if (p.life <= 0) { g.particles.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92;
    }
  }

  function cycleSpeed() {
    g.speed = g.speed === 1 ? 2 : (g.speed === 2 ? 4 : 1);
    return g.speed;
  }

  // expose
  g.start = start; g.quit = quit;
  g.cellFree = cellFree; g.towerAt = towerAt; g.pointAt = pointAt;
  g.towerCost = towerCost; g.placeTower = placeTower;
  g.upgradeTower = upgradeTower; g.sellTower = sellTower;
  g.startWave = startWave; g.cycleSpeed = cycleSpeed;
  g.spawnEnemy = spawnEnemy; g.onEnemyKilled = onEnemyKilled;
  g.auraSlowAt = auraSlowAt;
  g.fxLine = fxLine; g.fxRing = fxRing; g.fxBoom = fxBoom; g.fxHit = fxHit;
  g.fxText = fxText; g.addBurn = addBurn;
  g.shake = shake;
  g.chipHas = chipHas; g.pickChip = pickChip;
  g.abilityCost = abilityCost; g.abilityReady = abilityReady;
  g.castAbility = castAbility; g.doStrike = doStrike;
  g.tileAt = tileAt;
  g.acceptDeal = acceptDeal; g.purgeCorruption = purgeCorruption; g.purgeCost = purgeCost;
  g.pickFork = pickFork;
  g.toast = (m, k) => UI.toast(m, k);
  return g;
})();
</script>
<script>
/* ====================== js/ui.js ====================== */
/* NEURAL SIEGE — DOM UI: screens, HUD, sheets, input */
'use strict';
const UI = (function () {
  const $ = UTIL.el;
  let curScreen = 'screen-menu';
  let selLevel = 1, selDiff = 'standard';
  let bannerTimer = null;
  let bossRef = null;

  // ================================================================ SCREENS
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    curScreen = id;
    AUDIO.sfx.click();
  }

  function refreshMenu() {
    const st = SAVE.state;
    $('menu-stats').innerHTML =
      '◈ ' + st.cores + ' CORES &nbsp;·&nbsp; ★ ' + st.stats.starsTotal + '/150' +
      '<br>' + UTIL.fmt(st.stats.kills) + ' THREATS NEUTRALIZED' +
      '<br><span style="opacity:.55">v' + DATA.VERSION + '</span>';
  }

  // ================================================================ LEVEL SELECT
  let curSector = 0;
  function openLevels() {
    // jump to the sector containing the furthest unlocked level
    let furthest = 1;
    for (let i = 1; i <= 50; i++) if (SAVE.isUnlocked(i)) furthest = i;
    curSector = Math.min(4, Math.floor((furthest - 1) / 10));
    selLevel = furthest;
    buildSectorTabs();
    buildLevelGrid();
    $('levels-cores').textContent = '◈ ' + SAVE.state.cores;
    show('screen-levels');
  }

  function buildSectorTabs() {
    const wrap = $('sector-tabs');
    wrap.innerHTML = '';
    DATA.SECTORS.forEach((s, i) => {
      const unlocked = i === 0 || SAVE.isUnlocked(i * 10 + 1);
      const b = UTIL.h('button', 'stab' + (i === curSector ? ' active' : '') + (unlocked ? '' : ' locked'), s.tag + ' · ' + s.name);
      if (unlocked) b.onclick = () => { curSector = i; buildSectorTabs(); buildLevelGrid(); };
      wrap.appendChild(b);
    });
  }

  function buildLevelGrid() {
    const grid = $('level-grid');
    grid.innerHTML = '';
    const lo = curSector * 10 + 1, hi = lo + 9;
    let firstSelectable = null;
    for (let n = lo; n <= hi; n++) {
      const unlocked = SAVE.isUnlocked(n);
      const stars = SAVE.bestStars(n);
      const boss = !!DATA.BOSS_LEVELS[n];
      const node = UTIL.h('div', 'lvl-node' + (unlocked ? '' : ' locked') + (boss ? ' boss' : '') + (stars ? ' done' : ''));
      node.appendChild(UTIL.h('div', 'n', boss ? '☠' : String(n)));
      node.appendChild(UTIL.h('div', 'stars', stars ? '★'.repeat(stars) : (unlocked ? '·' : '🔒')));
      if (unlocked) {
        node.onclick = () => { selLevel = n; markSelected(); renderLevelDetail(); AUDIO.sfx.click(); };
        if (!firstSelectable) firstSelectable = n;
      }
      node.dataset.n = n;
      grid.appendChild(node);
    }
    if (selLevel < lo || selLevel > hi || !SAVE.isUnlocked(selLevel)) selLevel = firstSelectable || lo;
    markSelected();
    renderLevelDetail();
  }

  function renderLevelDetail() {

    const wonStd = SAVE.isWon(selLevel, 'standard');

    if (selDiff === 'insane' && !wonHard) selDiff = 'standard';

    const newT = MAPS.newThreatsAt(selLevel).map(id => DATA.ENEMIES[id].name);
    const newTw = MAPS.newTowersAt(selLevel).map(id => DATA.TOWERS[id].name);
    let flags = '';
    if (DATA.BOSS_LEVELS[selLevel]) flags += '☠ BOSS: ' + DATA.ENEMIES[DATA.BOSS_LEVELS[selLevel]].name + '  ';
    if (newT.length) flags += '⚠ New threat: ' + newT.join(', ') + '  ';
    if (newTw.length) flags += '✚ Unlocks: ' + newTw.join(', ');

    box.innerHTML = '';

    box.appendChild(UTIL.h('div', 'ld-sub', lv.waves + ' WAVES · ' + DATA.SECTORS[lv.sector].name +
      (SAVE.levelRec(selLevel).endlessBest ? ' · ENDLESS BEST: W' + SAVE.levelRec(selLevel).endlessBest : '')));
    box.appendChild(UTIL.h('div', 'ld-flags', flags));

    const diffRow = UTIL.h('div', 'ld-row');
    DATA.DIFFS.forEach(d => {

      const stars = SAVE.starsFor(selLevel, d.id);
      const b = UTIL.h('button', 'diff-btn' + (selDiff === d.id ? ' active' : '') + (locked ? ' locked' : ''),

  // ================================================================ ONBOARDING
  // First-ever run: three visual beats taught on the live controls.
  // The layer never blocks input — highlight + hint, the real tap does the work.
  let obStep = 0, obTimer = null, obCell = null;
  function maybeStartOnboarding() {
    if (SAVE.state.onboarded) return;
    if (GAME.levelN !== 1 || (SAVE.state.stats.towersBuilt || 0) > 0) return;
    obStep = 1; obCell = null;
    if (obTimer) clearInterval(obTimer);
    obTimer = setInterval(obTick, 150);
  }
  function endOnboarding(done) {
    if (obTimer) { clearInterval(obTimer); obTimer = null; }
    obStep = 0;
    $('onboard-layer').classList.remove('show');
    if (done) { SAVE.state.onboarded = true; SAVE.persist(); }
  }
  // free cell next to the path, ~30% of the way in (spiral out from there)
  function obFindCell() {
    const g = GAME, path = g.level.path;
    const mid = Math.floor(path.length * 0.3);
    for (let off = 0; off < path.length; off++) {
      for (const sgn of (off ? [1, -1] : [1])) {
        const i = mid + sgn * off;
        if (i < 0 || i >= path.length) continue;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const x = path[i].x + dx, y = path[i].y + dy;
          if (g.cellFree(x, y)) return { x, y };
        }
      }
    }
    return null;
  }
  function obPoint(rect, label, arrow) {
    const ring = $('ob-ring'), lab = $('ob-label'), ar = $('ob-arrow');
    ring.style.left = (rect.x - 5) + 'px';
    ring.style.top = (rect.y - 5) + 'px';
    ring.style.width = (rect.w + 10) + 'px';
    ring.style.height = (rect.h + 10) + 'px';
    ar.style.display = arrow ? 'block' : 'none';
    if (arrow) { ar.style.left = (rect.x + rect.w / 2) + 'px'; ar.style.top = (rect.y - 34) + 'px'; }
    lab.textContent = label;
    const half = lab.offsetWidth / 2 + 8;
    const cx = Math.max(half, Math.min(window.innerWidth - half, rect.x + rect.w / 2));
    lab.style.left = cx + 'px';
    lab.style.top = (rect.y - (arrow ? 68 : 44)) + 'px';
  }
  function obTick() {
    const g = GAME;
    if (obStep === 0) return;
    if (!g.active || curScreen !== 'screen-game') { endOnboarding(false); return; }
    const layer = $('onboard-layer');
    // wait behind blocking overlays (chip picker on level start, pause, end)
    if ($('chip-overlay').classList.contains('show') || $('pause-overlay').classList.contains('show') ||
        $('end-overlay').classList.contains('show')) { layer.classList.remove('show'); return; }
    // advance on real progress
    if (obStep === 1 && g.placingType) obStep = 2;
    if (obStep === 2 && !g.placingType && g.towers.length === 0) obStep = 1; // placement cancelled
    if (obStep <= 2 && g.towers.length > 0) obStep = 3;
    if (obStep === 3 && g.phase !== 'build') { endOnboarding(true); return; } // wave running — done
    layer.classList.add('show'); // before positioning: labels measure their own width
    if (obStep === 1) {
      const item = document.querySelector('.bb-item');
      if (!item) return;
      const r = item.getBoundingClientRect();
      obPoint({ x: r.left, y: r.top, w: r.width, h: r.height }, 'DEPLOY YOUR FIRST TOWER', false);
    } else if (obStep === 2) {
      if (!obCell || !g.cellFree(obCell.x, obCell.y)) obCell = obFindCell();
      if (!obCell) { layer.classList.remove('show'); return; }
      const p = RENDER.cellToScreen(obCell.x, obCell.y);
      obPoint({ x: p.x, y: p.y, w: RENDER.T, h: RENDER.T }, UTIL.tapWord() + ' THE TILE, THEN ✓', true);
    } else if (obStep === 3) {
      const r = $('btn-start-wave').getBoundingClientRect();
      if (r.width === 0) { layer.classList.remove('show'); return; }
      obPoint({ x: r.left, y: r.top, w: r.width, h: r.height }, 'START THE WAVE', false);
    }
  }

  function updateHUD() {
    const g = GAME;
    if (!g.active) return;
    $('hud-lives-v').textContent = g.lives;
    $('hud-cash-v').textContent = UTIL.fmt(g.cash);
    const wl = g.endless && g.wave > g.totalWaves ? 'W' + g.wave + ' ∞' : g.wave + '/' + g.totalWaves;
    $('hud-wave-v').textContent = wl;
    $('btn-speed').textContent = g.speed + '×';
    const sw = $('btn-start-wave');
    if (g.phase === 'build') {
      sw.classList.remove('hidden');
      const prev = WAVES.preview(g.levelN, g.wave, g.totalWaves, g.diff);
      const rush = g.rushT > 0 && g.rushBase > 0 ? Math.ceil(g.rushBase * (g.rushT / 22)) : 0;
      const fInfo = prev.formation ? WAVES.formationInfo(prev.formation) : null;
      const tag = prev.event
        ? ' <span style="color:#ffd166">' + DATA.EVENTS[prev.event].ico + ' ' + DATA.EVENTS[prev.event].name + '</span>'
        : (fInfo ? ' <span style="color:#ff8aa8">' + fInfo.ico + ' ' + fInfo.name + '</span>' : '');
      sw.innerHTML = '▶ START WAVE ' + g.wave +
        (rush > 0 ? ' <span style="color:#ffd166">+¤' + rush + '</span>' : '') + tag +
        '<br><span style="font-size:10px;font-weight:400;opacity:.75">' +
        prev.list.slice(0, 3).map(p => p.count + '× ' + DATA.ENEMIES[p.type].name).join(', ') +
        (prev.list.length > 3 ? ' +' : '') +
        (prev.event ? ' · ' + DATA.EVENTS[prev.event].desc : (fInfo ? ' · ' + fInfo.desc : '')) + '</span>';

      sw.classList.add('hidden');

    refreshPlaceActions();

  // ================================================================ WAVE INTEL
  // Fills the space between board and build bar with the incoming wave roster.
  function renderWaveIntel() {
    const g = GAME;
    const box = $('wave-intel');
    // hidden while placing: the placement card owns the bottom of the screen
    if (!g.active || g.phase !== 'build' || g.placingType) { box.classList.remove('show'); renderAlertChips(true); return; }
    const top = RENDER.boardBottom + 8;
    const bottomEdge = window.innerHeight - 185; // above the build bar block
    if (bottomEdge - top < 66) { box.classList.remove('show'); renderAlertChips(false); return; }
    box.style.top = top + 'px';
    box.style.maxHeight = (bottomEdge - top) + 'px';
    const prev = WAVES.preview(g.levelN, g.wave, g.totalWaves, g.diff, g.forkPick);
    box.innerHTML = '';
    let title = 'INCOMING — WAVE ' + g.wave + ' / ' + g.totalWaves;
    if (prev.hasBoss) title += '  <b>☠ BOSS</b>';
    else if (prev.hasMini) title += '  <b>⚠ MINI-BOSS</b>';
    if (g.diffDef.towerCap) title += '  <span style="color:#7fa8c9">· TOWERS ' + g.towers.length + '/' + g.diffDef.towerCap + '</span>';
    box.appendChild(UTIL.h('div', 'wi-title', title));
    const row = UTIL.h('div', 'wi-row');
    for (const p of prev.list.slice(0, 6)) {
      const cell = UTIL.h('div', 'wi-enemy');
      const cv = document.createElement('canvas');
      cv.width = cv.height = 60;
      RENDER.paintEnemyIcon(cv, p.type);
      cell.appendChild(cv);
      const e = DATA.ENEMIES[p.type];
      let marks = '';
      if (e.weak) marks += ' <span style="color:' + DATA.DTYPES[e.weak].color + '">▲' + DATA.DTYPES[e.weak].ico + '</span>';
      if (e.resist) marks += ' <span style="color:#5f6e89">▼' + DATA.DTYPES[e.resist].ico + '</span>';
      cell.appendChild(UTIL.h('span', '', '<span class="wc">×' + p.count + '</span>' + marks + '<br><span class="wn">' + e.name + '</span>'));
      row.appendChild(cell);
    }
    box.appendChild(row);
    const fInfo = prev.formation ? WAVES.formationInfo(prev.formation) : null;
    if (prev.event) box.appendChild(UTIL.h('div', 'wi-warn', DATA.EVENTS[prev.event].ico + ' ' + DATA.EVENTS[prev.event].name + ' — ' + DATA.EVENTS[prev.event].desc));
    else if (fInfo) box.appendChild(UTIL.h('div', 'wi-warn', fInfo.ico + ' ' + fInfo.name + ' — ' + fInfo.desc));

    // fork the wave: pick what's coming
    if (g.fork && !g.forkPick) {
      box.appendChild(buildForkCard());
    } else if (g.forkPick) {
      const f = WAVES.formationInfo(g.forkPick);
      box.appendChild(UTIL.h('div', 'wi-warn', '⑂ ROUTED: ' + f.ico + ' ' + f.name));
    }

    // deal on the table
    if (g.deal) {
      box.appendChild(buildDealCard());
    } else if (g.dealAccepted === 'insurance') {
      box.appendChild(UTIL.h('div', 'wi-warn', '⛨ INSURED FOR THIS WAVE'));
    } else if (g.dealAccepted === 'bargain') {
      box.appendChild(UTIL.h('div', 'wi-warn', "¤ BARGAIN STRUCK — NEXT WAVE +35%"));
    }

    // corruption purge
    if (Object.keys(g.corrupt).length) box.appendChild(buildPurgeCard());
    box.classList.add('show');
    renderAlertChips(true);
  }

  // Shared action cards: rendered inside the intel panel when it fits,
  // or inside the tile popup (via alert chips / tile taps) when it doesn't.

  function buildForkCard() {

  // ============================================================= TILE POPUP
  // Tap any special tile to learn what it is (and act on it).
  let tilePopT = null, tilePopSticky = false;
  function hideTilePop() {
    $('tile-pop').classList.remove('show');
    tilePopSticky = false;
    if (tilePopT) { clearTimeout(tilePopT); tilePopT = null; }
  }
  function showTilePop(cellY, nodes, autoHide) {
    const box = $('tile-pop');
    box.innerHTML = '';
    for (const n of nodes) box.appendChild(n);
    // sit above the build bar; if the tapped cell is down there, jump to the top
    const cellPx = cellY == null ? -1 : RENDER.cellToScreen(0, cellY + 1).y;
    if (cellPx > window.innerHeight - 330) { box.style.top = '66px'; box.style.bottom = 'auto'; }
    else { box.style.bottom = '195px'; box.style.top = 'auto'; }
    box.classList.add('show');
    tilePopSticky = !autoHide;
    if (tilePopT) clearTimeout(tilePopT);
    tilePopT = autoHide ? setTimeout(hideTilePop, 4500) : null;
  }
  const TILE_INFO = {
    hill:  { t: '▲ UPLINK RIDGE',   c: '#ffd166', d: 'High ground. Towers built on this tile get <b>+1 RANGE</b>.' },
    power: { t: '⚡ POWER NODE',     c: '#7fdcff', d: 'Live conduit. Towers built on this tile deal <b>+25% DAMAGE</b>.' },
    dead:  { t: '▦ DEAD ZONE',      c: '#ff5252', d: 'Scorched sector. <b>Nothing can be built here.</b>' },
    block: { t: '▪ DATA BLOCK',     c: '#8fb3d4', d: 'Solid obstruction. Cannot build on it.' },
  };
  function tapTileInfo(cell) {
    const g = GAME;
    if (g.corrupt[cell.x + ',' + cell.y]) {
      const nodes = [
        UTIL.h('div', 'tp-title', '<span style="color:#c86bff">☣ CORRUPTED TILE</span>'),
        UTIL.h('div', 'tp-desc', 'Spreads to a neighboring tile after every wave, eating your build space.'),
      ];
      if (g.phase === 'build') nodes.push(buildPurgeCard());
      showTilePop(cell.y, nodes, g.phase !== 'build');
      AUDIO.sfx.click();
      return true;
    }
    const tk = g.tileAt(cell.x, cell.y) || (g.grid[cell.x + ',' + cell.y] === 'block' ? 'block' : null);
    const info = TILE_INFO[tk];
    if (!info) return false;
    showTilePop(cell.y, [
      UTIL.h('div', 'tp-title', '<span style="color:' + info.c + '">' + info.t + '</span>'),
      UTIL.h('div', 'tp-desc', info.d),
    ], true);
    AUDIO.sfx.click();
    return true;
  }

  // ============================================================ ALERT CHIPS
  // When the intel panel has no room (tall boards), pending decisions surface
  // as pulsing chips above the build bar; tapping one opens the card popup.
  function renderAlertChips(panelFits) {
    const g = GAME;
    const box = $('alert-chips');
    box.innerHTML = '';
    const pending = [];
    if (g.active && g.phase === 'build' && !panelFits && !g.placingType) {
      if (g.fork && !g.forkPick) pending.push(['⑂ ROUTE', buildForkCard, '']);
      if (g.deal) pending.push([DATA.DEALS[g.deal.id].ico + ' DEAL', buildDealCard, '']);
      if (Object.keys(g.corrupt).length) pending.push(['☣ PURGE ¤' + g.purgeCost(), buildPurgeCard, 'danger']);
    }
    for (const [label, builder, cls] of pending) {
      const b = UTIL.h('button', 'al-chip ' + cls, label);
      b.onclick = () => { AUDIO.unlock(); showTilePop(null, [builder()], false); };
      box.appendChild(b);
    }
    box.style.bottom = '192px';
    box.classList.toggle('show', pending.length > 0);
    // an open action card is stale once the build phase ends
    if (tilePopSticky && g.phase !== 'build') hideTilePop();
  }

  // ================================================================ ABILITIES
  function buildAbilityBar() {
    const wrap = $('ability-btns');
    wrap.innerHTML = '';
    const unlocked = Object.keys(DATA.ABILITIES).filter(k => GAME.levelN >= DATA.ABILITIES[k].unlock);
    $('ability-bar').classList.toggle('show', unlocked.length > 0);
    for (const key of unlocked) {
      const a = DATA.ABILITIES[key];
      const b = UTIL.h('button', 'ab-btn', a.ico + '<span class="ab-cost">' + GAME.abilityCost(key) + '</span>');
      b.dataset.ab = key;
      b.title = a.name + ' — ' + a.desc;
      b.onclick = () => { AUDIO.unlock(); GAME.castAbility(key); };
      wrap.appendChild(b);
    }
    refreshAbilities();
  }

  function refreshAbilities() {
    const g = GAME;
    if (!g.active) return;
    $('energy-fill').style.height = Math.round(g.energy) + '%';
    document.querySelectorAll('.ab-btn').forEach(b => {
      const key = b.dataset.ab;
      const ready = g.abilityReady(key);
      b.disabled = !ready;
      b.classList.toggle('ready', ready);
      b.classList.toggle('armed', g.abilityTarget === 'strike' && key === 'strike');
    });
  }

  // ================================================================ CHIP PICKER
  function showChipPicker(choices) {
    if (!choices || !choices.length) return;
    const card = $('chip-card');
    card.innerHTML = '';
    card.appendChild(UTIL.h('h2', '', '◈ PROTOCOL CHIP'));
    card.appendChild(UTIL.h('div', 'chip-sub', 'Pick one boost for this deployment.'));
    for (const c of choices) {
      const b = UTIL.h('button', 'chip-opt',
        '<span class="ci">' + c.ico + '</span><span><span class="cn">' + c.name + '</span><br><span class="cd">' + c.desc + '</span></span>');
      b.onclick = () => {
        GAME.pickChip(c.id);
        $('chip-overlay').classList.remove('show');
        toast('CHIP INSTALLED: ' + c.name.toUpperCase(), 'warn');
        AUDIO.sfx.upgrade();
        refreshChipInd();
      };
      card.appendChild(b);
    }
    $('chip-overlay').classList.add('show');
  }

  // persistent badge showing the active chip; tap it to re-read the effect
  function refreshChipInd() {
    const box = $('chip-ind');
    const g = GAME;
    if (!g.active || !g.chips.length) { box.classList.remove('show'); return; }
    const defs = g.chips.map(id => DATA.CHIPS.find(c => c.id === id)).filter(Boolean);
    box.innerHTML = defs.map(c => '<span>' + c.ico + '</span>').join('');
    box.onclick = () => {
      toast(defs.map(c => c.ico + ' ' + c.name + ': ' + c.desc).join(' · '), 'warn');

  function hurtFlash() {
    const elv = $('hud-lives');
    elv.classList.remove('hurt');
    void elv.offsetWidth;
    elv.classList.add('hurt');
  }

  function phaseBanner(text, threat) {
    const b = $('phase-banner');
    b.textContent = text;
    b.classList.toggle('threat', !!threat);
    b.classList.add('show');
    if (bannerTimer) clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => b.classList.remove('show'), 2600);
  }

  function toast(msg, kind) {
    const zone = $('toast-zone');
    while (zone.children.length >= 3) zone.removeChild(zone.firstChild);
    const t = UTIL.h('div', 'toast' + (kind ? ' ' + kind : ''), msg);
    zone.appendChild(t);
    setTimeout(() => { if (t.parentNode) t.parentNode.removeChild(t); }, 2700);
  }

  function bossBar(e) {
    bossRef = e;
    $('boss-bar').classList.toggle('show', !!e);
    if (e) $('boss-bar-name').textContent = e.displayName || e.def.name;
  }
  setInterval(() => {
    if (bossRef && !bossRef.dead) {
      $('boss-bar-fill').style.width = Math.max(0, bossRef.hp / bossRef.maxHp * 100) + '%';
    } else if (bossRef) bossBar(null);
    // live tickers: combo, energy, rush countdown
    const g = GAME;
    if (!g.active) return;
    const ci = $('combo-ind');
    if (g.combo >= 5 && g.phase === 'combat') {
      ci.textContent = '×' + g.combo + ' COMBO';
      ci.classList.add('show');
      ci.style.transform = 'scale(' + Math.min(1.5, 1 + g.combo * 0.01) + ')';
    } else ci.classList.remove('show');
    if (g.phase === 'combat') refreshAbilities();
  }, 120);
  // rush bonus countdown on the start button (cheap, only during build)
  setInterval(() => {
    if (GAME.active && GAME.phase === 'build' && GAME.rushT > 0) updateHUD();
  }, 1000);

  function checkAchToasts() {
    const fresh = SAVE.checkAchievements();
    for (const a of fresh) toast('🏆 ' + a.name.toUpperCase(), 'warn');
  }

  // ================================================================ BUILD BAR
  function buildBuildBar() {
    const bar = $('build-bar');
    bar.innerHTML = '';
    const unlocked = MAPS.unlockedTowers(GAME.levelN);
    for (const id of unlocked) {
      const t = DATA.TOWERS[id];
      const item = UTIL.h('div', 'bb-item');
      item.dataset.type = id;
      const cv = document.createElement('canvas');
      cv.width = cv.height = 72;
      RENDER.paintTowerIcon(cv, id, 0);
      item.appendChild(cv);
      item.appendChild(UTIL.h('div', 'bb-cost', '¤' + GAME.towerCost(id)));
      item.appendChild(UTIL.h('div', 'bb-name', t.name));
      item.onclick = () => {
        if (GAME.phase !== 'build') { toast('DEPLOY ONLY BETWEEN WAVES', 'warn'); AUDIO.sfx.error(); return; }
        if (GAME.placingType === id) { cancelPlacement(); }
        else {
          GAME.placingType = id; GAME.placeCell = null; GAME.selectedTower = null;
          closeSheets(); hideTilePop(); renderPlaceInfo(id);
          renderBuildSheet(id); $('build-panel').classList.add('open');
          refreshPlaceActions(); renderWaveIntel();
        }
        refreshBuildBarState();
        AUDIO.sfx.click();
      };
      bar.appendChild(item);
    }
    refreshBuildBarState();
  }

  function refreshBuildBarState() {
    const g = GAME;
    document.querySelectorAll('.bb-item').forEach(item => {
      const id = item.dataset.type;
      item.classList.toggle('selected', g.placingType === id);
      item.classList.toggle('poor', g.cash < g.towerCost(id));
      item.classList.toggle('disabled', g.phase !== 'build');
    });
  }

  // Compact info inside the single placement bar (no sheet during placement)
  function renderPlaceInfo(id) {
    const t = DATA.TOWERS[id];
    const l0 = t.levels[0];
    const box = $('place-info');
    box.innerHTML = '';
    const cv = document.createElement('canvas'); cv.width = cv.height = 72;
    RENDER.paintTowerIcon(cv, id, 0);
    box.appendChild(cv);
    const mid = UTIL.h('div');
    mid.appendChild(UTIL.h('div', 'pi-name', t.name + ' — ¤' + GAME.towerCost(id)));
    const bits = [];
    if (l0.dmg) bits.push('DMG ' + l0.dmg);
    if (l0.rate) bits.push(Math.round(l0.rate * 100) / 100 + '/s');
    bits.push('RNG ' + l0.range);
    if (l0.slow) bits.push('SLOW ' + Math.round(l0.slow * 100) + '%');
    if (l0.splash) bits.push('SPLASH ' + l0.splash);
    if (l0.chains) bits.push('CHAIN ×' + l0.chains);
    if (l0.income) bits.push('+¤' + l0.income + '/wave');
    if (l0.buffDmg) bits.push('+' + Math.round(l0.buffDmg * 100) + '% DMG aura');
    if (t.dtype) bits.push('<span style="color:' + DATA.DTYPES[t.dtype].color + '">' + DATA.DTYPES[t.dtype].ico + ' ' + DATA.DTYPES[t.dtype].name + '</span>');
    bits.push(t.air ? 'hits air' : 'ground only');
    mid.appendChild(UTIL.h('div', 'pi-stats', bits.join(' · ')));
    box.appendChild(mid);
  }

  function statChips(lv) {
    const bits = [];
    if (lv.dmg) bits.push('DMG <b>' + Math.round(lv.dmg) + '</b>');
    if (lv.rate) bits.push('RATE <b>' + (Math.round(lv.rate * 100) / 100) + '/s</b>');
    bits.push('RANGE <b>' + lv.range + '</b>');
    if (lv.slow) bits.push('SLOW <b>' + Math.round(lv.slow * 100) + '%</b>');
    if (lv.splash) bits.push('SPLASH <b>' + lv.splash + '</b>');
    if (lv.chains) bits.push('CHAINS <b>' + lv.chains + '</b>');
    if (lv.stun) bits.push('STUN <b>' + lv.stun + 's</b>');
    if (lv.income) bits.push('INCOME <b>¤' + lv.income + '/wave</b>');
    if (lv.buffDmg) bits.push('BUFF <b>+' + Math.round(lv.buffDmg * 100) + '% DMG</b>');
    if (lv.buffRate) bits.push('BUFF <b>+' + Math.round(lv.buffRate * 100) + '% RATE</b>');
    return bits.map(b => '<span>' + b + '</span>').join('');
  }

  // ================================================================ BUILD SHEET
  // Rich pre-placement sheet: stats plus the full evolution path (tiers +
  // branch machines) so upgrading has a visible destination. Collapses to the
  // compact placement card on the first grid tap.
  function renderBuildSheet(id) {
    const t = DATA.TOWERS[id];
    const body = $('build-panel-body');
    body.innerHTML = '';
    const head = UTIL.h('div', 'tp-head');
    const cv = document.createElement('canvas'); cv.width = cv.height = 92;
    RENDER.paintTowerIcon(cv, id, 0);
    head.appendChild(cv);
    const hd = UTIL.h('div');
    hd.appendChild(UTIL.h('div', 'tp-title', t.name + ' — <span style="color:#ffd166">¤' + GAME.towerCost(id) + '</span>'));
    const bits = [];
    if (t.dtype) bits.push('<span style="color:' + DATA.DTYPES[t.dtype].color + '">' + DATA.DTYPES[t.dtype].ico + ' ' + DATA.DTYPES[t.dtype].name + '</span>');
    bits.push(t.air ? 'HITS AIR' : 'GROUND ONLY');
    hd.appendChild(UTIL.h('div', 'tp-tier', bits.join(' · ')));
    head.appendChild(hd);
    body.appendChild(head);
    const x = UTIL.h('button', 'sheet-close', '✕');
    x.onclick = () => { cancelPlacement(); AUDIO.sfx.click(); };
    body.appendChild(x);
    body.appendChild(UTIL.h('div', 'tp-stats', statChips(t.levels[0])));
    body.appendChild(UTIL.h('div', 'bs-desc', t.desc));
    // evolution path: tier icons growing into the two branch machines
    const evo = UTIL.h('div', 'evo-row');
    for (let i = 0; i < 4; i++) {
      if (i > 0) evo.appendChild(UTIL.h('span', 'evo-arrow', '›'));
      const ec = document.createElement('canvas');
      ec.width = ec.height = 64;
      ec.className = 'evo-ico';
      RENDER.paintTowerIcon(ec, id, i);
      evo.appendChild(ec);
    }
    body.appendChild(UTIL.h('div', 'bs-label', 'EVOLUTION'));
    body.appendChild(evo);
    const brs = DATA.BRANCHES[id];
    if (brs) {
      body.appendChild(UTIL.h('div', 'bs-label', 'TIER III SPECIALIZATIONS — PICK ONE'));
      const row = UTIL.h('div', 'evo-branches');
      brs.forEach((b, bi) => {
        const card = UTIL.h('div', 'evo-branch');
        const bc = document.createElement('canvas');
        bc.width = bc.height = 72;
        RENDER.paintTowerIcon(bc, id, 3, bi);
        card.appendChild(bc);
        const tx = UTIL.h('div');
        tx.appendChild(UTIL.h('div', 'eb-name', b.ico + ' ' + b.name));
        tx.appendChild(UTIL.h('div', 'eb-desc', b.desc));
        card.appendChild(tx);
        row.appendChild(card);
      });
      body.appendChild(row);
    }
  }

  // ================================================================ TOWER PANEL
  const MODES = ['first', 'last', 'strong', 'close'];
  function openTowerPanel(tw) {
    GAME.selectedTower = tw;
    GAME.placingType = null; GAME.placeCell = null;
    refreshBuildBarState();
    renderTowerPanel();
    $('build-panel').classList.remove('open');
    $('tower-panel').classList.add('open');
  }

  function renderTowerPanel() {
    const tw = GAME.selectedTower;
    if (!tw) return;
    const body = $('tower-panel-body');
    body.innerHTML = '';
    const head = UTIL.h('div', 'tp-head');
    const cv = document.createElement('canvas'); cv.width = cv.height = 92;
    RENDER.paintTowerIcon(cv, tw.type, tw.tier, tw.branch);
    head.appendChild(cv);
    const hd = UTIL.h('div');
    const branchName = (tw.tier === 3 && tw.branch !== null && DATA.BRANCHES[tw.type])
      ? DATA.BRANCHES[tw.type][tw.branch].name : null;
    hd.appendChild(UTIL.h('div', 'tp-title', branchName || tw.def.name));
    hd.appendChild(UTIL.h('div', 'tp-tier', 'TIER ' + UTIL.ROMAN[tw.tier] + (branchName ? ' ★' : '') + ' · ' + tw.kills + ' KILLS'));
    head.appendChild(hd);
    body.appendChild(head);
    const x = UTIL.h('button', 'sheet-close', '✕');
    x.onclick = closeSheets;
    body.appendChild(x);
    body.appendChild(UTIL.h('div', 'tp-stats', statChips(tw.def.levels[tw.tier])));

    const upCost = tw.upgradeCost();
    const isBranchPoint = tw.tier === 2 && DATA.BRANCHES[tw.type];

    if (tw.tier < 3 && !isBranchPoint) {
      const nxt = tw.def.levels[tw.tier + 1];
      body.appendChild(UTIL.h('div', 'tp-upnext', '⬆ TIER ' + UTIL.ROMAN[tw.tier + 1] + ': ' + statChips(nxt)));
    }

    // final upgrade forks: choose a specialization
    if (isBranchPoint) {
      body.appendChild(UTIL.h('div', 'tp-upnext', '⬆ TIER IV — choose a specialization (¤' + upCost + '):'));
      const brow = UTIL.h('div', 'branch-row');
      DATA.BRANCHES[tw.type].forEach((br, idx) => {
        const b = UTIL.h('button', 'branch-btn',
          '<div class="bn">' + br.ico + ' ' + br.name.toUpperCase() + '</div><div class="bd">' + br.desc + '</div>');
        b.disabled = GAME.cash < upCost || GAME.phase !== 'build';
        b.onclick = () => { if (GAME.upgradeTower(tw, idx)) renderTowerPanel(); };
        brow.appendChild(b);
      });
      body.appendChild(brow);
    }

    const row = UTIL.h('div', 'tp-actions');
    if (!isBranchPoint) {
      const up = UTIL.h('button', 'btn btn-primary', upCost === null ? 'MAX TIER' : '⬆ UPGRADE ¤' + upCost);
      up.disabled = upCost === null || GAME.cash < upCost || GAME.phase !== 'build';
      up.onclick = () => { if (GAME.upgradeTower(tw)) renderTowerPanel(); };
      row.appendChild(up);
    }

    if (tw.def.kind !== 'income' && tw.def.kind !== 'buffaura' && tw.def.kind !== 'slowaura' && tw.def.kind !== 'field' && tw.def.kind !== 'emp') {
      const tgt = UTIL.h('button', 'btn', '◎ ' + tw.targetMode.toUpperCase());
      tgt.onclick = () => {
        tw.targetMode = MODES[(MODES.indexOf(tw.targetMode) + 1) % MODES.length];
        tgt.textContent = '◎ ' + tw.targetMode.toUpperCase();
        AUDIO.sfx.click();
      };
      row.appendChild(tgt);
    }

    const refund = tw.fresh ? tw.invested : tw.sellValue();
    const sell = UTIL.h('button', 'btn btn-danger', tw.fresh ? '↩ UNDO ¤' + refund : '✕ SELL ¤' + refund);
    sell.disabled = GAME.phase !== 'build';
    sell.onclick = () => { if (GAME.sellTower(tw)) closeSheets(); };
    row.appendChild(sell);
    if (tw.fresh) {
      body.appendChild(UTIL.h('div', 'tp-upnext', 'Fresh deployment — UNDO refunds the full ¤' + refund + ' until the wave starts.'));
    }
    body.appendChild(row);
    if (GAME.phase !== 'build') {
      body.appendChild(UTIL.h('div', 'tp-upnext', '⏳ Wave in progress — modifications locked until deploy phase.'));
    }
  }

  function closeSheets() {
    $('tower-panel').classList.remove('open');
    $('build-panel').classList.remove('open');
    if (GAME.selectedTower) GAME.selectedTower = null;
    if (!GAME.placingType) $('place-actions').classList.remove('show');
  }

  // ================================================================ END / PAUSE
  function showEnd(won, stars, cores) {
    const card = $('end-card');
    card.innerHTML = '';
    card.appendChild(UTIL.h('h2', won ? 'win' : 'lose', won ? 'NODE SECURED' : 'CORE BREACHED'));
    if (won) {
      const gr = GAME.grade || 'B';
      const gcol = { S: '#ffd166', A: '#7fdcff', B: '#9fd4ff', C: '#7fa8c9' }[gr];
      card.appendChild(UTIL.h('div', '', '<span style="font-size:44px;font-weight:900;color:' + gcol +
        ';text-shadow:0 0 20px ' + gcol + '">' + gr + '</span>' +
        (gr === 'S' ? ' <span style="font-size:11px;color:#ffd166">FLAWLESS +30% ◈</span>' : '')));
      card.appendChild(UTIL.h('div', 'end-stars', '★'.repeat(stars) + '<span style="opacity:.25">' + '★'.repeat(3 - stars) + '</span>'));
      card.appendChild(UTIL.h('div', 'end-line',
        'Integrity ' + GAME.lives + '/' + GAME.maxLives + ' · ' + GAME.stats.kills + ' kills · best combo ×' + (GAME.bestCombo || 0) +
        '<br>' + (GAME.perfectWaves || 0) + ' perfect waves · DATA CORES: <b>+' + cores + ' ◈</b>'));
    } else {
      card.appendChild(UTIL.h('div', 'end-line',
        'Survived to wave ' + GAME.wave + ' of ' + GAME.totalWaves +
        '<br>' + GAME.stats.kills + ' threats neutralized.'));
    }
    if (won) {
      if (!GAME.endless) {
        const cont = UTIL.h('button', 'btn', '∞ CONTINUE ENDLESS');
        cont.onclick = () => {
          $('end-overlay').classList.remove('show');
          GAME.endless = true;
          GAME.phase = 'build';
          phaseBanner('OVERTIME — THREATS COMPOUND. NO RETREAT.', true);
          updateHUD();
        };
        card.appendChild(cont);
      }
      if (GAME.levelN < 50 && !GAME.endless) {
        const nxt = UTIL.h('button', 'btn btn-primary', '▶ NEXT NODE');
        nxt.onclick = () => {
          $('end-overlay').classList.remove('show');
          GAME.start(GAME.levelN + 1, GAME.diff, false);
        };
        card.appendChild(nxt);
      }
    } else {
      const rty = UTIL.h('button', 'btn btn-primary', '↻ RETRY NODE');
      rty.onclick = () => {
        $('end-overlay').classList.remove('show');
        GAME.start(GAME.levelN, GAME.diff, GAME.endless);
      };
      card.appendChild(rty);
    }
    const back = UTIL.h('button', 'btn', 'NODE SELECT');
    back.onclick = () => { $('end-overlay').classList.remove('show'); GAME.quit(); refreshMenu(); openLevels(); };
    card.appendChild(back);
    $('end-overlay').classList.add('show');
  }

    $('pause-overlay').classList.toggle('show', on);
    if (on) renderPauseToggles();
  }
  function renderPauseToggles() {

      s.onclick = () => {
