<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>NEURAL SIEGE — AI Tower Defense</title>
<style>
/* NEURAL SIEGE — mobile-first UI */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; overscroll-behavior:none; }
body {
  background:#05070d; color:#cfe8ff;
  font-family:'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  touch-action:manipulation; user-select:none; -webkit-user-select:none;
}
button { font-family:inherit; }

#app { position:fixed; inset:0; }

.screen {
  position:absolute; inset:0; display:none; flex-direction:column;
  background:radial-gradient(120% 90% at 50% 0%, #0b1226 0%, #05070d 60%);
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
}
.screen.active { display:flex; }

/* ---------- Buttons ---------- */
.btn {
  display:block; width:100%; padding:14px 18px; margin:6px 0;
  background:linear-gradient(180deg,#12203a,#0b1526);
  border:1px solid #1e3a5f; border-radius:12px;
  color:#9fd4ff; font-size:15px; font-weight:600; letter-spacing:1.5px;
  cursor:pointer; transition:transform .06s, box-shadow .2s;
}
.btn:active { transform:scale(.97); }
.btn-primary {
  background:linear-gradient(180deg,#0e5a8a,#083a5e);
  border-color:#2196d8; color:#e2f5ff;
  box-shadow:0 0 18px rgba(33,150,216,.35), inset 0 0 12px rgba(80,190,255,.15);
}
.btn-big { font-size:19px; padding:17px; }
.btn-danger { background:linear-gradient(180deg,#5a1020,#3a0812); border-color:#c2334d; color:#ff9fb0; }
.btn-back { width:44px; height:40px; padding:0; margin:0; font-size:24px; line-height:1; border-radius:10px; }
.btn:disabled { opacity:.38; pointer-events:none; }

/* ---------- Main menu ---------- */
#screen-menu { align-items:center; justify-content:center; }
.menu-bg { position:absolute; inset:0; opacity:.5; pointer-events:none;
  background-image:
    linear-gradient(rgba(38,110,180,.12) 1px, transparent 1px),
    linear-gradient(90deg, rgba(38,110,180,.12) 1px, transparent 1px);
  background-size:36px 36px;
  animation:gridslide 14s linear infinite;
}
@keyframes gridslide { from { background-position:0 0; } to { background-position:0 36px; } }
.menu-inner { position:relative; width:min(360px, 88vw); text-align:center; }
.logo { margin-bottom:34px; }
.logo-top {
  font-size:52px; font-weight:800; letter-spacing:10px; color:#e8f7ff;
  text-shadow:0 0 24px #2aa8ff, 0 0 60px rgba(42,168,255,.5);
}
.logo-bottom {
  font-size:52px; font-weight:800; letter-spacing:14px; color:#ff3d71;
  text-shadow:0 0 24px #ff3d71, 0 0 60px rgba(255,61,113,.45); margin-top:-8px;
}
.logo-sub { margin-top:10px; font-size:11px; letter-spacing:6px; color:#5f89ad; }
.menu-stats { margin-top:26px; font-size:12px; color:#5f89ad; letter-spacing:1px; line-height:1.8; }

/* ---------- Generic screen head ---------- */
.screen-head {
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px; gap:10px;
}
.screen-head h1 { font-size:17px; letter-spacing:4px; color:#bfe3ff; font-weight:700; }
.head-cores { font-size:15px; color:#ffd166; font-weight:700; white-space:nowrap; }
.screen-hint { font-size:12px; color:#5f89ad; padding:0 16px 10px; line-height:1.5; }

/* ---------- Level select ---------- */
.sector-tabs { display:flex; gap:6px; padding:0 12px 10px; overflow-x:auto; }
.stab {
  flex:1 0 auto; padding:9px 14px; border-radius:10px; border:1px solid #1e3a5f;
  background:#0b1526; color:#7fb2d9; font-size:12px; font-weight:700; letter-spacing:1px; cursor:pointer;
}
.stab.active { background:#0e5a8a; color:#fff; border-color:#2aa8ff; box-shadow:0 0 12px rgba(42,168,255,.4); }
.stab.locked { opacity:.4; }
.levels-scroll { flex:1; overflow-y:auto; padding:4px 14px; }
.level-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:10px; }
.lvl-node {
  aspect-ratio:1; border-radius:14px; border:1px solid #1e3a5f;
  background:linear-gradient(180deg,#101c33,#0a1322);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  cursor:pointer; position:relative; color:#cfe8ff;
}
.lvl-node .n { font-size:17px; font-weight:800; }
.lvl-node .stars { font-size:10px; color:#ffd166; letter-spacing:1px; margin-top:2px; height:11px; }
.lvl-node.locked { opacity:.35; }
.lvl-node.boss { border-color:#c2334d; box-shadow:inset 0 0 14px rgba(255,61,113,.18); }
.lvl-node.boss .n { color:#ff7d9c; }
.lvl-node.done { border-color:#2aa8ff; }
.lvl-node.selected { outline:2px solid #2aa8ff; box-shadow:0 0 16px rgba(42,168,255,.5); }
.level-detail {
  border-top:1px solid #14243d; padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  background:#080e1a; min-height:132px;
}
.ld-title { font-size:15px; font-weight:800; letter-spacing:2px; margin-bottom:2px; }
.ld-sub { font-size:11px; color:#5f89ad; margin-bottom:8px; }
.ld-row { display:flex; gap:8px; }
.diff-btn {
  flex:1; padding:10px 4px; border-radius:10px; border:1px solid #1e3a5f; background:#0b1526;
  color:#9fd4ff; font-size:12px; font-weight:700; cursor:pointer;
}
.diff-btn.active { border-color:#2aa8ff; background:#0e5a8a; color:#fff; }
.diff-btn.locked { opacity:.35; pointer-events:none; }
.ld-row .btn { margin:0; flex:1.4; }
.ld-flags { font-size:11px; color:#d9a441; margin:6px 0; min-height:14px; }

/* ---------- Research ---------- */
.research-scroll { flex:1; overflow-y:auto; padding:0 14px calc(20px + env(safe-area-inset-bottom)); }
.res-item {
  display:flex; align-items:center; gap:12px; padding:12px; margin-bottom:10px;
  border:1px solid #1e3a5f; border-radius:14px; background:linear-gradient(180deg,#101c33,#0a1322);
}
.res-ico { font-size:26px; width:44px; height:44px; border-radius:10px; background:#0b1526;
  display:flex; align-items:center; justify-content:center; flex-shrink:0; border:1px solid #1e3a5f; }
.res-mid { flex:1; min-width:0; }
.res-name { font-size:14px; font-weight:700; }
.res-desc { font-size:11px; color:#7fa8c9; line-height:1.4; margin-top:2px; }
.res-pips { font-size:11px; letter-spacing:2px; color:#2aa8ff; margin-top:4px; }
.res-buy { width:86px; flex-shrink:0; }
.res-buy .btn { margin:0; padding:10px 4px; font-size:13px; }

/* ---------- Codex ---------- */
.codex-tabs { display:flex; gap:8px; padding:0 14px 10px; }
.ctab { flex:1; padding:10px; border-radius:10px; border:1px solid #1e3a5f; background:#0b1526;
  color:#7fb2d9; font-weight:700; letter-spacing:2px; font-size:12px; cursor:pointer; }
.ctab.active { background:#0e5a8a; color:#fff; border-color:#2aa8ff; }
.codex-scroll { flex:1; overflow-y:auto; padding:0 14px calc(20px + env(safe-area-inset-bottom)); }
.cdx-item {
  display:flex; gap:12px; padding:12px; margin-bottom:10px; align-items:center;
  border:1px solid #1e3a5f; border-radius:14px; background:linear-gradient(180deg,#101c33,#0a1322);
}
.cdx-item.locked { opacity:.45; }
.cdx-sprite { width:52px; height:52px; flex-shrink:0; border-radius:10px; background:#070d18;
  border:1px solid #14243d; display:flex; align-items:center; justify-content:center; }
.cdx-sprite canvas { width:44px; height:44px; }
.cdx-name { font-size:14px; font-weight:800; letter-spacing:1px; }
.cdx-tags { font-size:10px; color:#d9a441; letter-spacing:1px; margin:2px 0; }
.cdx-desc { font-size:11px; color:#7fa8c9; line-height:1.45; }
.cdx-stats { font-size:10px; color:#5f89ad; margin-top:3px; }

/* ---------- Settings ---------- */
.settings-list { flex:1; overflow-y:auto; padding:0 16px; }
.set-row { display:flex; align-items:center; justify-content:space-between; padding:14px 4px;
  border-bottom:1px solid #14243d; }
.set-label { font-size:14px; font-weight:600; }
.set-sub { font-size:11px; color:#5f89ad; margin-top:2px; }
.toggle { width:52px; height:30px; border-radius:15px; background:#14243d; border:1px solid #1e3a5f;
  position:relative; cursor:pointer; flex-shrink:0; transition:background .2s; }
.toggle::after { content:''; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:#5f89ad; transition:all .2s; }
.toggle.on { background:#0e5a8a; border-color:#2aa8ff; }
.toggle.on::after { left:25px; background:#7fdcff; box-shadow:0 0 8px #2aa8ff; }
.settings-danger { padding:16px; }

/* ---------- Game screen ---------- */
#screen-game { background:#05070d; }
#game-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

#hud-top {
  position:absolute; top:env(safe-area-inset-top); left:0; right:0; height:52px;
  display:flex; align-items:center; gap:6px; padding:6px 8px;
  background:linear-gradient(180deg, rgba(5,8,15,.92), rgba(5,8,15,.55) 80%, transparent);
  z-index:10; pointer-events:none;
}
#hud-top > * { pointer-events:auto; }
.hud-btn {
  width:44px; height:40px; border-radius:10px; border:1px solid #1e3a5f; background:rgba(11,21,38,.9);
  color:#9fd4ff; font-size:16px; font-weight:800; cursor:pointer; flex-shrink:0;
}
.hud-stat {
  display:flex; align-items:center; gap:5px; padding:0 10px; height:40px; border-radius:10px;
  background:rgba(11,21,38,.9); border:1px solid #1e3a5f; font-size:14px; font-weight:800; flex:1;
  justify-content:center; white-space:nowrap;
}
#hud-lives .ico { color:#ff5d8a; } #hud-cash .ico { color:#ffd166; }
#hud-lives.hurt { animation:hurtflash .5s; }
@keyframes hurtflash { 0%,100%{background:rgba(11,21,38,.9)} 40%{background:rgba(160,20,50,.95)} }

#phase-banner {
  position:absolute; top:calc(env(safe-area-inset-top) + 60px); left:50%; transform:translateX(-50%);
  padding:8px 22px; border-radius:20px; font-size:13px; font-weight:800; letter-spacing:3px;
  background:rgba(8,14,26,.9); border:1px solid #2aa8ff; color:#7fdcff; z-index:11;
  opacity:0; transition:opacity .4s; pointer-events:none; text-align:center; white-space:nowrap;
}
#phase-banner.show { opacity:1; }
#phase-banner.threat { border-color:#ff3d71; color:#ff8aa8; }

#boss-bar {
  position:absolute; top:calc(env(safe-area-inset-top) + 56px); left:12px; right:12px; z-index:9;
  display:none;
}
#boss-bar.show { display:block; }
#boss-bar-name { font-size:11px; font-weight:800; letter-spacing:2px; color:#ff8aa8; text-align:center; margin-bottom:3px;
  text-shadow:0 0 8px rgba(255,61,113,.8); }
.boss-track { height:8px; border-radius:4px; background:rgba(20,10,18,.85); border:1px solid #c2334d; overflow:hidden; }
#boss-bar-fill { height:100%; width:100%; background:linear-gradient(90deg,#ff3d71,#ff8a5c); transition:width .15s; }

#combo-ind {
  position:absolute; top:calc(env(safe-area-inset-top) + 58px); right:14px; z-index:9;
  font-size:15px; font-weight:900; letter-spacing:1px; color:#ffd166;
  text-shadow:0 0 12px rgba(255,209,102,.8); opacity:0; transition:opacity .2s, transform .1s;
  pointer-events:none; transform-origin:right center; white-space:nowrap;
}
#combo-ind.show { opacity:1; }

#chip-ind {
  position:absolute; top:calc(env(safe-area-inset-top) + 58px); left:12px; z-index:9;
  display:none; align-items:center; justify-content:center; gap:4px;
  min-width:34px; height:34px; padding:0 8px; border-radius:17px;
  background:rgba(11,21,38,.92); border:1px solid #d9a441; color:#ffd166;
  font-size:15px; cursor:pointer;
  box-shadow:0 0 10px rgba(217,164,65,.3);
}
#chip-ind.show { display:flex; }

#ability-bar {
  position:absolute; right:8px; bottom:210px; z-index:11;
  display:none; flex-direction:column; align-items:center; gap:8px;
}
#ability-bar.show { display:flex; }
#energy-bar {
  width:10px; height:64px; border-radius:5px; background:rgba(11,21,38,.9);
  border:1px solid #1e3a5f; overflow:hidden; display:flex; align-items:flex-end;
}
#energy-fill {
  width:100%; background:linear-gradient(0deg,#2aa8ff,#7fdcff); border-radius:4px;
  box-shadow:0 0 8px #2aa8ff; transition:height .2s;
}
.ab-btn {
  width:52px; height:52px; border-radius:14px; border:1px solid #1e3a5f;
  background:rgba(11,21,38,.94); color:#cfe8ff; cursor:pointer; position:relative;
  font-size:20px; line-height:1;
}
.ab-btn .ab-cost { position:absolute; bottom:2px; right:5px; font-size:10px; color:#7fdcff; font-weight:800; }
.ab-btn.ready { border-color:#2aa8ff; box-shadow:0 0 14px rgba(42,168,255,.55); }
.ab-btn.armed { border-color:#ffd166; box-shadow:0 0 16px rgba(255,209,102,.8); background:#2c2410; }
.ab-btn:disabled { opacity:.35; }

/* chip picker */
#chip-card h2 { color:#7fdcff; font-size:16px; letter-spacing:3px; margin-bottom:4px; }
.chip-sub { font-size:11px; color:#5f89ad; margin-bottom:14px; }
.chip-opt {
  display:flex; align-items:center; gap:12px; width:100%; padding:13px 12px; margin:7px 0;
  border:1px solid #1e3a5f; border-radius:14px; background:linear-gradient(180deg,#101c33,#0a1322);
  color:#cfe8ff; cursor:pointer; text-align:left;
}
.chip-opt:active { transform:scale(.98); }
.chip-opt .ci { font-size:24px; width:40px; height:40px; flex-shrink:0; display:flex; align-items:center;
  justify-content:center; background:#0b1526; border-radius:10px; border:1px solid #1e3a5f; }
.chip-opt .cn { font-size:13px; font-weight:800; }
.chip-opt .cd { font-size:11px; color:#7fa8c9; margin-top:2px; }

/* branch upgrade choice */
.branch-row { display:flex; gap:8px; margin-bottom:8px; }
.branch-btn {
  flex:1; padding:10px 8px; border-radius:12px; border:1px solid #2aa8ff;
  background:linear-gradient(180deg,#0e2c4a,#0a1c30); color:#cfe8ff; cursor:pointer; text-align:left;
}
.branch-btn .bn { font-size:12px; font-weight:800; color:#7fdcff; }
.branch-btn .bd { font-size:10px; color:#7fa8c9; margin-top:3px; line-height:1.35; }
.branch-btn:disabled { opacity:.4; }

#toast-zone {
  position:absolute; bottom:190px; left:0; right:0; z-index:12; pointer-events:none;
  display:flex; flex-direction:column; align-items:center; gap:6px;
}
.toast {
  padding:8px 18px; border-radius:18px; background:rgba(8,14,26,.94); border:1px solid #1e3a5f;
  color:#cfe8ff; font-size:12px; font-weight:700; letter-spacing:1px; animation:toastin 2.6s forwards;
}
.toast.warn { border-color:#d9a441; color:#ffd166; }
@keyframes toastin { 0%{opacity:0; transform:translateY(10px)} 10%,80%{opacity:1; transform:none} 100%{opacity:0; transform:translateY(-8px)} }

#place-actions {
  position:absolute; left:10px; right:10px; bottom:158px; z-index:16; /* above sheets */
  display:none; flex-direction:column; gap:8px;
  background:rgba(8,14,26,.9); border:1px solid #1e3a5f; border-radius:16px;
  padding:10px; box-shadow:0 6px 24px rgba(0,0,0,.55);
  pointer-events:none; /* grid taps pass through — only the buttons catch touches */
  transition:top .15s, bottom .15s;
}
#place-actions .btn { pointer-events:auto; }
#place-actions.show { display:flex; }
#place-actions.top { bottom:auto; top:calc(env(safe-area-inset-top) + 58px); } /* dodge when placing low on the map */
#place-info { display:flex; align-items:center; gap:10px; min-height:40px; padding-right:42px; }
#place-info canvas { width:40px; height:40px; flex-shrink:0; }
.pi-name { font-size:13.5px; font-weight:800; white-space:nowrap; }
.pi-stats { font-size:10.5px; color:#7fa8c9; line-height:1.35; }
.pa-close {
  position:absolute; top:8px; right:8px; width:34px; height:34px;
  border-radius:10px; border:1px solid #1e3a5f; background:#0b1526; color:#9fd4ff;
  font-size:15px; font-weight:800; cursor:pointer; font-family:inherit;
  pointer-events:auto;
}
/* deploy button exists only once a tile is chosen — no placeholder state */
#btn-place-ok { display:none; margin:0; padding:13px 8px; font-size:14px; letter-spacing:2px; box-shadow:0 0 22px rgba(33,150,216,.55); }
#place-actions.armed #btn-place-ok { display:block; }
#btn-place-ok:disabled { opacity:.45; box-shadow:none; }

.sheet-close {
  position:absolute; top:10px; right:12px; width:38px; height:38px;
  border-radius:10px; border:1px solid #1e3a5f; background:#0b1526; color:#9fd4ff;
  font-size:17px; font-weight:800; cursor:pointer;
}

#wave-intel {
  position:absolute; left:10px; right:10px; z-index:8;
  display:none; flex-direction:column; gap:8px;
  background:rgba(8,14,26,.72); border:1px solid #14243d; border-radius:14px;
  padding:10px 12px;
}
#wave-intel.show { display:flex; }
.wi-title { font-size:10px; letter-spacing:2px; color:#5f89ad; font-weight:800; }
.wi-title b { color:#ffd166; }
.wi-row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
.wi-enemy { display:flex; align-items:center; gap:5px; }
.wi-enemy canvas { width:30px; height:30px; }
.wi-enemy .wc { font-size:12px; font-weight:800; color:#cfe8ff; }
.wi-enemy .wn { font-size:10px; color:#7fa8c9; }
.wi-warn { font-size:11px; font-weight:800; color:#ff8aa8; letter-spacing:1px; }
.wi-deal { border-top:1px solid #14243d; padding-top:8px; display:flex; flex-direction:column; gap:6px; }
.wi-btns { display:flex; gap:8px; }
.wi-btn { margin:0; padding:9px 8px; font-size:11.5px; flex:1; }

/* tap-a-tile info card (also hosts deal/fork/purge when the intel panel has no room) */
#tile-pop {
  position:absolute; left:12px; right:12px; z-index:15;
  display:none; flex-direction:column; gap:7px;
  background:rgba(10,16,30,.96); border:1px solid #24406a; border-radius:14px;
  padding:11px 13px; box-shadow:0 6px 24px rgba(0,0,0,.55);
}
#tile-pop.show { display:flex; }
.tp-title { font-size:12px; font-weight:800; letter-spacing:1.5px; }
.tp-desc { font-size:11px; color:#8fb3d4; line-height:1.45; }

/* compact fallback chips when the intel panel doesn't fit on screen */
#alert-chips {
  position:absolute; left:10px; z-index:12;
  display:none; gap:8px;
}
#alert-chips.show { display:flex; }
.al-chip {
  border:1px solid #3a2a55; background:rgba(20,12,34,.92); color:#e6d7ff;
  border-radius:999px; padding:8px 13px; font-size:11.5px; font-weight:800;
  letter-spacing:1px; font-family:inherit;
  animation:al-pulse 1.6s ease-in-out infinite;
}
.al-chip.danger { border-color:#5a1f33; background:rgba(34,10,20,.92); color:#ffb3c6; }
@keyframes al-pulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.05); } }

#hud-bottom {
  position:absolute; bottom:0; left:0; right:0; z-index:10;
  padding:8px 10px calc(10px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, rgba(5,8,15,.95) 70%, transparent);
}
#btn-start-wave { margin:8px 0 0; letter-spacing:3px; }
#btn-start-wave.hidden { display:none; }

#build-bar { display:flex; gap:8px; overflow-x:auto; padding:4px 2px; scrollbar-width:none; }
#build-bar::-webkit-scrollbar { display:none; }
.bb-item {
  flex:0 0 auto; width:64px; border-radius:12px; border:1px solid #1e3a5f; background:rgba(11,21,38,.92);
  padding:5px 2px 6px; text-align:center; cursor:pointer; position:relative;
}
.bb-item canvas { width:36px; height:36px; display:block; margin:0 auto; }
.bb-item .bb-cost { font-size:10px; font-weight:800; color:#ffd166; }
.bb-item .bb-name { font-size:10px; color:#7fa8c9; letter-spacing:.3px; overflow:hidden; white-space:nowrap; }
.bb-item.selected { border-color:#2aa8ff; box-shadow:0 0 12px rgba(42,168,255,.55); background:#0e2c4a; }
.bb-item.poor { opacity:.45; }
.bb-item.disabled { opacity:.3; pointer-events:none; }

/* ---------- Bottom sheets ---------- */
.sheet {
  position:absolute; left:0; right:0; bottom:0; z-index:14;
  background:#0a1220; border-top:1px solid #1e3a5f; border-radius:18px 18px 0 0;
  transform:translateY(105%); transition:transform .22s cubic-bezier(.2,.8,.3,1);
  padding:6px 14px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.6);
}
.sheet.open { transform:translateY(0); }
.sheet-grip { width:42px; height:4px; border-radius:2px; background:#1e3a5f; margin:4px auto 8px; }
.tp-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.tp-head canvas { width:46px; height:46px; }

.overlay {

}

.overlay-card {

}

/* ---- desktop / wide viewport (portal web view): letterbox the HUD ----
   The board already centers itself; this pins every UI bar to the same
   phone-width column so wide iframes (CrazyGames etc.) look intentional. */
@media (min-width: 700px) {
  #hud-top, #hud-bottom, #toast-zone { left:calc(50% - 270px); right:calc(50% - 270px); }

      radial-gradient(110% 90% at 50% 0%, #0a1122 0%, #05070d 65%);

  .side-l { left:0; right:calc(50% + 272px); }
  .side-r { left:calc(50% + 272px); right:0; }

    content:''; position:absolute; top:0; bottom:0; width:2px;

  .side-r::before { left:0; }

/* ====================== js/util.js ====================== */
/* NEURAL SIEGE — utilities */
'use strict';
const UTIL = (function () {

  // Deterministic PRNG (mulberry32)
  function rng(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rint(r, lo, hi) { return lo + Math.floor(r() * (hi - lo + 1)); }
  function choice(r, arr) { return arr[Math.floor(r() * arr.length)]; }
  function wchoice(r, items, weights) {
    let total = 0;
    for (let i = 0; i < weights.length; i++) total += weights[i];
    let x = r() * total;
    for (let i = 0; i < items.length; i++) { x -= weights[i]; if (x <= 0) return items[i]; }
    return items[items.length - 1];
  }

  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
  const dist2 = (x1, y1, x2, y2) => (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);

  function fmt(n) {
    n = Math.floor(n);
    if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
    if (n >= 10000) return (n / 1000).toFixed(1) + 'k';
    return String(n);
  }

  function el(id) { return document.getElementById(id); }
  // device-appropriate verb for instructional text
  function tapWord() { return ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 'TAP' : 'CLICK'; }
  function tapWordLc() { return tapWord() === 'TAP' ? 'Tap' : 'Click'; }

  function h(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }

  // Roman numerals for tiers
  const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI'];

  return { rng, rint, choice, wchoice, clamp, lerp, dist, dist2, fmt, el, h, ROMAN , tapWord, tapWordLc };
})();
</script>

<script>
/* ====================== js/save.js ====================== */
/* NEURAL SIEGE — persistence & meta progression */
'use strict';
const SAVE = (function () {
  const KEY = 'neural_siege_save_v1';

  const defaults = () => ({
    cores: 0,
    // per level: { stars: {standard:0..3, hard:0..3, insane:0..3}, endlessBest: 0 }
    levels: {},
    research: {},
    achievements: {},
    seenEnemies: {},
    settings: { sfx: true, music: true, shake: true, autostart: false, autocast: false },
    stats: {
      kills: 0, wavesCleared: 0, towersBuilt: 0, upgradesBought: 0, maxCash: 0,
      perfectWins: 0, bossKills: 0, insaneWins: 0, maxTier: 0, leaks: 0,
      cashEarned: 0, playSeconds: 0,
      sectorClear1: 0, sectorClear2: 0, sectorClear3: 0, sectorClear4: 0, sectorClear5: 0,
      starsTotal: 0, endlessBestAny: 0,
    },
  });

  let state = defaults();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        state = Object.assign(defaults(), parsed);
        state.settings = Object.assign(defaults().settings, parsed.settings || {});
        state.stats = Object.assign(defaults().stats, parsed.stats || {});
      }
    } catch (e) { state = defaults(); }
    return state;
  }

  let saveTimer = null;
  function persist() {
    if (saveTimer) return;
    saveTimer = setTimeout(() => {
      saveTimer = null;
      try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* storage full/blocked */ }
    }, 200);
  }

  function wipe() {
    state = defaults();
    try { localStorage.removeItem(KEY); } catch (e) {}
    persist();
  }

  // ---------- level progress ----------
  function levelRec(n) {
    if (!state.levels[n]) state.levels[n] = { stars: {}, endlessBest: 0 };
    return state.levels[n];
  }
  function starsFor(n, diff) { return (state.levels[n] && state.levels[n].stars[diff]) || 0; }
  function bestStars(n) {
    const rec = state.levels[n];
    if (!rec) return 0;
    return Math.max(rec.stars.standard || 0, rec.stars.hard || 0, rec.stars.insane || 0);
  }
  function isWon(n, diff) { return starsFor(n, diff || 'standard') > 0; }
  function isUnlocked(n) { return n === 1 || isWon(n - 1, 'standard') || isWon(n - 1, 'hard') || isWon(n - 1, 'insane'); }
  function recomputeStarTotal() {
    let t = 0;
    for (const k in state.levels) {
      const s = state.levels[k].stars;
      t += Math.max(s.standard || 0, s.hard || 0, s.insane || 0);
    }
    state.stats.starsTotal = t;
  }
  function recordWin(n, diff, stars, coresEarned) {
    const rec = levelRec(n);
    const prev = rec.stars[diff] || 0;
    if (stars > prev) rec.stars[diff] = stars;
    state.cores += coresEarned;
    recomputeStarTotal();
    // sector clears
    for (let s = 1; s <= 5; s++) {
      let all = true;
      for (let l = (s - 1) * 10 + 1; l <= s * 10; l++) if (bestStars(l) === 0) { all = false; break; }
      if (all) state.stats['sectorClear' + s] = 1;
    }
    persist();
  }

  // ---------- research ----------
  function researchLevel(id) { return state.research[id] || 0; }
  function researchValue(id) {
    const def = DATA.RESEARCH.find(r => r.id === id);
    if (!def) return 0;
    return researchLevel(id) * def.per;
  }
  function buyResearch(id) {
    const def = DATA.RESEARCH.find(r => r.id === id);
    const lvl = researchLevel(id);
    if (!def || lvl >= def.max) return false;
    const cost = def.costs[lvl];
    if (state.cores < cost) return false;
    state.cores -= cost;
    state.research[id] = lvl + 1;
    persist();
    return true;
  }

  // ---------- stats & achievements ----------
  function addStat(k, v) {
    state.stats[k] = (state.stats[k] || 0) + v;
    persist();
  }
  function maxStat(k, v) {
    if (v > (state.stats[k] || 0)) { state.stats[k] = v; persist(); }
  }
  // returns newly unlocked achievement defs
  function checkAchievements() {
    const fresh = [];
    for (const a of DATA.ACHIEVEMENTS) {
      if (state.achievements[a.id]) continue;
      if ((state.stats[a.stat] || 0) >= a.goal) {
        state.achievements[a.id] = true;
        fresh.push(a);
      }
    }
    if (fresh.length) persist();
    return fresh;
  }

  function markSeen(enemyId) {
    if (!state.seenEnemies[enemyId]) { state.seenEnemies[enemyId] = true; persist(); }
  }

  return {
    load, persist, wipe,
    get state() { return state; },
    levelRec, starsFor, bestStars, isWon, isUnlocked, recordWin,
    researchLevel, researchValue, buyResearch,
    addStat, maxStat, checkAchievements, markSeen,
  };
})();
</script>
<script>
/* ====================== js/audio.js ====================== */
/* NEURAL SIEGE — procedural WebAudio SFX + ambient music (no asset files needed) */
'use strict';
const AUDIO = (function () {
  let ctx = null, master = null, sfxGain = null, musicGain = null;
  let unlocked = false;
  let musicTimer = null, musicStep = 0;

  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      master = ctx.createGain(); master.gain.value = 0.6; master.connect(ctx.destination);
      sfxGain = ctx.createGain(); sfxGain.connect(master);
      musicGain = ctx.createGain(); musicGain.gain.value = 0.32; musicGain.connect(master);
      applySettings();
    } catch (e) { ctx = null; }
  }

  function unlock() {
    init();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();
    unlocked = true;
    startMusic();
  }

  function applySettings() {
    if (!ctx) return;
    const s = SAVE.state.settings;
    if (master) master.gain.value = 0.6;
    sfxGain.gain.value = s.sfx ? 1 : 0;
    musicGain.gain.value = s.music ? 0.32 : 0;
    if (s.music && unlocked) startMusic(); else stopMusic();
  }

  // ---------- tiny synth helpers ----------
  function tone(freq, dur, type, vol, slideTo, delay) {
    if (!ctx || !unlocked || !SAVE.state.settings.sfx) return;
    const t0 = ctx.currentTime + (delay || 0);
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, freq) {
    if (!ctx || !unlocked || !SAVE.state.settings.sfx) return;
    const t0 = ctx.currentTime;
    const len = Math.max(1, Math.floor(ctx.sampleRate * dur));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 900;
    const g = ctx.createGain(); g.gain.setValueAtTime(vol || 0.2, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(sfxGain);
    src.start(t0);
  }

  // ---------- SFX vocabulary (throttled per frame kind) ----------
  const lastPlay = {};
  function throttled(kind, minGap) {
    const now = performance.now();
    if (lastPlay[kind] && now - lastPlay[kind] < minGap) return true;
    lastPlay[kind] = now; return false;
  }

  const SFX = {
    shot()      { if (throttled('shot', 45)) return; tone(880, 0.07, 'square', 0.05, 440); },
    scan()      { if (throttled('scan', 40)) return; tone(1500, 0.04, 'sawtooth', 0.03, 1200); },
    snipe()     { if (throttled('snipe', 80)) return; tone(220, 0.18, 'sawtooth', 0.14, 60); noise(0.1, 0.1, 2500); },
    chain()     { if (throttled('chain', 70)) return; tone(1200, 0.1, 'sawtooth', 0.06, 300); },
    boom()      { if (throttled('boom', 60)) return; noise(0.3, 0.25, 500); tone(90, 0.25, 'sine', 0.2, 40); },
    beam()      { if (throttled('beam', 900)) return; tone(180, 0.5, 'sawtooth', 0.02, 220); },
    orb()       { if (throttled('orb', 90)) return; tone(600, 0.14, 'sine', 0.1, 1400); },
    empPulse()  { if (throttled('emp', 200)) return; tone(400, 0.35, 'sine', 0.15, 60); noise(0.2, 0.08, 700); },
    die()       { if (throttled('die', 50)) return; noise(0.12, 0.12, 1200); tone(300, 0.1, 'triangle', 0.07, 80); },
    bossDie()   { noise(0.7, 0.35, 400); tone(60, 0.8, 'sine', 0.3, 30); tone(120, 0.7, 'sawtooth', 0.15, 40, 0.1); },
    leak()      { tone(320, 0.25, 'sawtooth', 0.2, 90); },
    build()     { tone(520, 0.08, 'square', 0.12); tone(780, 0.1, 'square', 0.12, undefined, 0.07); },
    upgrade()   { tone(520, 0.08, 'square', 0.1); tone(660, 0.08, 'square', 0.1, undefined, 0.07); tone(880, 0.14, 'square', 0.12, undefined, 0.14); },
    sell()      { tone(700, 0.08, 'square', 0.1, 300); },
    cash()      { if (throttled('cash', 120)) return; tone(1046, 0.06, 'sine', 0.08); tone(1568, 0.09, 'sine', 0.08, undefined, 0.05); },
    error()     { if (throttled('error', 150)) return; tone(160, 0.12, 'square', 0.1, 120); },
    click()     { if (throttled('click', 60)) return; tone(900, 0.03, 'square', 0.05); },
    waveStart() { tone(392, 0.12, 'sawtooth', 0.14); tone(523, 0.12, 'sawtooth', 0.14, undefined, 0.11); tone(659, 0.2, 'sawtooth', 0.16, undefined, 0.22); },
    waveClear() { tone(659, 0.1, 'sine', 0.14); tone(784, 0.1, 'sine', 0.14, undefined, 0.09); tone(1046, 0.22, 'sine', 0.16, undefined, 0.18); },
    victory()   { [523, 659, 784, 1046, 1318].forEach((f, i) => tone(f, 0.3, 'sine', 0.16, undefined, i * 0.13)); },
    defeat()    { [400, 320, 240, 150].forEach((f, i) => tone(f, 0.4, 'sawtooth', 0.14, f * 0.7, i * 0.2)); },
    newThreat() { tone(200, 0.2, 'sawtooth', 0.14, 400); tone(200, 0.2, 'sawtooth', 0.14, 400, 0.25); },
    stun()      { if (throttled('stun', 150)) return; tone(1800, 0.08, 'sine', 0.05, 900); },
    alarm()     { tone(1300, 0.06, 'square', 0.07); tone(1300, 0.06, 'square', 0.07, undefined, 0.14); },
  };

  // ---------- ambient generative music ----------
  // Minor-key pad progression + sparse arpeggio; deliberately low-key so it loops for hours.
  const CHORDS = [
    [110.00, 130.81, 164.81], // Am
    [87.31, 110.00, 130.81],  // F
    [98.00, 123.47, 146.83],  // G
    [82.41, 110.00, 123.47],  // E-ish
  ];
  function padChord(freqs, dur) {
    if (!ctx || !SAVE.state.settings.music) return;
    const t0 = ctx.currentTime;
    freqs.forEach(f => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      const o2 = ctx.createOscillator(), g2 = ctx.createGain();
      o2.type = 'sine'; o2.frequency.value = f * 2.003; g2.gain.value = 0.35;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.05, t0 + dur * 0.3);
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(musicGain);
      o.start(t0); o.stop(t0 + dur); o2.start(t0); o2.stop(t0 + dur);
    });
  }
  function arpNote(f, delay) {
    if (!ctx || !SAVE.state.settings.music) return;
    const t0 = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.045, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
    o.connect(g); g.connect(musicGain); o.start(t0); o.stop(t0 + 0.55);
  }
  function musicBar() {
    const chord = CHORDS[musicStep % CHORDS.length];
    padChord(chord, 4.2);
    if (musicStep % 2 === 1) {
      for (let i = 0; i < 4; i++) {
        if (Math.random() < 0.6) arpNote(chord[i % chord.length] * 4, 0.5 + i * 0.9);
      }
    }
    musicStep++;
  }
  function startMusic() {
    if (!ctx || musicTimer || !SAVE.state.settings.music) return;
    musicBar();
    musicTimer = setInterval(musicBar, 4000);
  }
  function stopMusic() {
    if (musicTimer) { clearInterval(musicTimer); musicTimer = null; }
  }

  return { unlock, applySettings, sfx: SFX };
})();
</script>
<script>
/* ====================== js/maps.js ====================== */
/* NEURAL SIEGE — 50 deterministic level maps (seeded path carving on a grid) */
'use strict';
const MAPS = (function () {
  const COLS = 11;

  // Carve a self-avoiding path from the top edge to the bottom edge.
  // Rule: a candidate cell may touch at most the current head (keeps lanes readable).
  function carve(cols, rows, r, minLen, maxLen) {
    const key = (x, y) => y * cols + x;
    for (let attempt = 0; attempt < 400; attempt++) {
      const sx = UTIL.rint(r, 1, cols - 2);
      let cur = { x: sx, y: 0 };
      const path = [cur];
      const used = new Set([key(sx, 0)]);
      let ok = false;

      for (let steps = 0; steps < cols * rows; steps++) {
        if (cur.y === rows - 1) { ok = path.length >= minLen; break; }
        const dirs = [
          { x: 0, y: 1, w: 3.2 },
          { x: -1, y: 0, w: 2.1 },
          { x: 1, y: 0, w: 2.1 },
          { x: 0, y: -1, w: 0.55 },
        ];
        const cands = [];
        for (const d of dirs) {
          const nx = cur.x + d.x, ny = cur.y + d.y;
          if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) continue;
          if (used.has(key(nx, ny))) continue;
          // count used neighbors of candidate other than current head
          let touch = 0;
          if (nx > 0 && used.has(key(nx - 1, ny))) touch++;
          if (nx < cols - 1 && used.has(key(nx + 1, ny))) touch++;
          if (ny > 0 && used.has(key(nx, ny - 1))) touch++;
          if (ny < rows - 1 && used.has(key(nx, ny + 1))) touch++;
          if (touch > 1) continue; // only the head may touch it
          // bias downward more when path is getting long
          let w = d.w;
          if (path.length > maxLen * 0.8 && d.y === 1) w *= 4;
          cands.push({ d, w });
        }
        if (!cands.length) break;
        const pick = UTIL.wchoice(r, cands, cands.map(c => c.w)).d;
        cur = { x: cur.x + pick.x, y: cur.y + pick.y };
        path.push(cur);
        used.add(key(cur.x, cur.y));
        if (path.length > maxLen && cur.y < rows - 1) break; // too long, retry
      }
      if (ok) return path;
    }
    // Guaranteed fallback: straight column
    const sx = Math.floor(cols / 2);
    const p = [];
    for (let y = 0; y < rows; y++) p.push({ x: sx, y });
    return p;
  }

  // Decorative blocked cells (server racks) on cells not adjacent to the path.
  function placeBlocks(cols, rows, path, r, count) {
    const near = new Set();
    for (const c of path) {
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
        near.add((c.y + dy) * cols + (c.x + dx));
      }
    }
    const blocks = [];
    let guard = 0;
    while (blocks.length < count && guard++ < 300) {
      const x = UTIL.rint(r, 0, cols - 1), y = UTIL.rint(r, 1, rows - 2);
      const k = y * cols + x;
      if (near.has(k) || blocks.some(b => b.x === x && b.y === y)) continue;
      blocks.push({ x, y });
    }
    return blocks;
  }

  const cache = {};
  function level(n) {
    if (cache[n]) return cache[n];
    const sector = Math.min(4, Math.floor((n - 1) / 10));
    const r = UTIL.rng(0xA1F00D + n * 7919);
    const rows = 14 + Math.min(3, Math.floor((n - 1) / 14)); // 14 → 17 rows as campaign advances
    // path length target grows with level: early = short lanes, later = winding mazes
    const minLen = Math.floor(rows + 2 + Math.min(28, n * 0.9));
    const maxLen = Math.floor(rows + 10 + Math.min(44, n * 1.3));
    const path = carve(COLS, rows, r, minLen, maxLen);
    const blocks = placeBlocks(COLS, rows, path, r, 3 + UTIL.rint(r, 0, 3) + Math.floor(n / 15));

    // special terrain: hills (+range), power nodes (+dmg), dead zones (unbuildable).
    // Placement is scored, not random: bonus tiles go where a tower can actually
    // work the path, dead zones deny prime real estate.
    const tiles = [];
    const taken = new Set(path.map(p => p.x + ',' + p.y).concat(blocks.map(b => b.x + ',' + b.y)));
    const cover = (x, y, r2) => {
      let n = 0, best = 1e9;
      for (const p of path) {
        const d = (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y);
        if (d <= r2) n++;
        if (d < best) best = d;
      }
      return { n, near: Math.sqrt(best) };
    };
    const candidates = [];
    for (let y = 1; y < rows - 1; y++) for (let x = 0; x < COLS; x++) {
      if (taken.has(x + ',' + y)) continue;
      const base = cover(x, y, 6.25);   // path cells inside ~standard tower range
      if (base.near > 2.2) continue;    // too far to ever matter
      const wide = cover(x, y, 12.25);  // path cells a +1-range tower could reach
      candidates.push({ x, y, base: base.n, wide: wide.n, near: base.near });
    }
    const wantTiles = [
      // hills pay off where +1 range unlocks extra path beyond normal reach
      ['hill', 1 + UTIL.rint(r, 0, 1), c => c.wide + c.base * 0.5],
      // power nodes pay off on maximum direct coverage
      ['power', 1 + UTIL.rint(r, 0, 1), c => c.base * 2 + c.wide * 0.25],
      // dead zones hurt most on the tiles you'd most want (hug the path)
      ['dead', UTIL.rint(r, 1, 2), c => (c.near <= 1.2 ? c.base * 2 : 0)],
    ];
    for (const [kind, cnt, score] of wantTiles) {
      for (let placed = 0; placed < cnt; placed++) {
        const open = candidates.filter(c => !taken.has(c.x + ',' + c.y) && score(c) > 0);
        if (!open.length) break;
        open.sort((a, b) => score(b) - score(a));
        // pick among the best few (seeded) so maps stay varied
        const pick = open[UTIL.rint(r, 0, Math.min(open.length - 1, 3))];
        taken.add(pick.x + ',' + pick.y);
        tiles.push({ x: pick.x, y: pick.y, kind });
      }
    }

    const waves = 10 + Math.floor(n * 0.28);            // 10 → 24 waves
    const startCash = 165 + n * 16;
    const lives = 20;
    const def = {
      n, sector, cols: COLS, rows, path, blocks, tiles, waves, startCash, lives,
      boss: DATA.BOSS_LEVELS[n] || null,
      name: nodeName(n, r),
    };
    cache[n] = def;
    return def;
  }

  const NODE_WORDS_A = ['GATE', 'RELAY', 'SHARD', 'SPINE', 'MESH', 'VAULT', 'LOOP', 'STACK', 'GRID', 'PORT'];
  const NODE_WORDS_B = ['ALPHA', 'BETA', 'GAMMA', 'DELTA', 'EPSILON', 'ZETA', 'THETA', 'SIGMA', 'OMEGA', 'PRIME'];
  function nodeName(n, r) {
    if (DATA.BOSS_LEVELS[n]) return DATA.ENEMIES[DATA.BOSS_LEVELS[n]].name;
    return NODE_WORDS_A[n % 10] + ' ' + NODE_WORDS_B[Math.floor(n / 5) % 10] + '-' + (n < 10 ? '0' : '') + n;
  }

  // Enemy types whose unlock === n (for "NEW THREAT" intro)
  function newThreatsAt(n) {
    const out = [];
    for (const id in DATA.ENEMIES) {
      const e = DATA.ENEMIES[id];
      if (e.unlock === n && !e.nopool) out.push(id);
    }
    return out;
  }
  // Towers whose unlock === n
  function newTowersAt(n) {
    return DATA.TOWER_ORDER.filter(id => DATA.TOWERS[id].unlock === n);
  }
  function unlockedTowers(n) {
    return DATA.TOWER_ORDER.filter(id => DATA.TOWERS[id].unlock <= n);
  }
  function unlockedEnemies(n) {
    const out = [];
    for (const id in DATA.ENEMIES) {
      const e = DATA.ENEMIES[id];
      if (!e.nopool && e.unlock <= n) out.push(id);
    }
    return out;
  }

  return { level, newThreatsAt, newTowersAt, unlockedTowers, unlockedEnemies, COLS };
})();
</script>
<script>
/* ====================== js/waves.js ====================== */
/* NEURAL SIEGE — wave composition (deterministic per level+wave+difficulty) */
'use strict';
const WAVES = (function () {

  // HP multiplier applied to an enemy's base hp
  function hpScale(level, wave, diffMult, totalWaves) {
    // progress-relative: same difficulty envelope regardless of how many waves a level has
    const p = Math.max(0, (wave - 1) / Math.max(1, (totalWaves || 20) - 1));
    const earlyGrit = 1 + 0.22 * Math.exp(-(level - 1) / 7); // early enemies are no pushovers
    return (1 + 0.045 * (level - 1) + (1.15 + 0.13 * level) * Math.pow(p, 1.35)) * diffMult * earlyGrit;
  }
  function bountyScale(level, diff, p) {
    // bounties grow with level but decay across a level: late waves have more
    // kills, so per-kill pay drops to keep income roughly flat vs rising threat
    return (1 + 0.018 * level) * diff.bountyMult * (1 - 0.30 * Math.min(1, p || 0));
  }

  // Themed wave formations: each asks a different question of your build
  const FORMATIONS = {
    rush:    { name: 'SPEED RUSH',   ico: '»', desc: 'Fast movers only',            match: e => e.speed >= 1.7, budgetMult: 1.0, hpMult: 0.85 },
    horde:   { name: 'HORDE',        ico: '≋', desc: 'A flood of light units',      match: e => e.threat <= 4,  budgetMult: 1.5, hpMult: 0.75 },
    siege:   { name: 'SIEGE COLUMN', ico: '▣', desc: 'Few, massive, armored',       match: e => e.hp >= 70,     budgetMult: 0.8, hpMult: 1.2 },
    airraid: { name: 'AIR RAID',     ico: '✈', desc: 'Airborne assault',            match: e => e.traits && e.traits.flying },
    phantom: { name: 'PHANTOM OPS',  ico: '◌', desc: 'Stealth infiltration',        match: e => e.traits && e.traits.stealth },
  };
  // formation display data for the UI
  function formationInfo(key) { return FORMATIONS[key] || null; }

  // Build the spawn schedule for one wave: array of {delay, type, hpMult, banner}
  function build(level, wave, totalWaves, diff, forcedFormation) {
    const r = UTIL.rng(0xBEEF + level * 10007 + wave * 271);
    const diffDef = DATA.DIFFS.find(d => d.id === diff) || DATA.DIFFS[0];
    const events = [];
    const isBossWave = !!(DATA.BOSS_LEVELS[level] && wave === totalWaves);
    const isEliteWave = !isBossWave && wave === totalWaves;
    let hs = hpScale(level, wave, diffDef.hpMult, totalWaves);

    // themed formation roll first, else a wave event (never both, never on bosses)
    let event = null, formation = null;
    if (forcedFormation && !isBossWave) {
      formation = forcedFormation;
    } else if (!isBossWave && wave >= 3) {
      const roll = r();
      if (roll < 0.35) {
        const fkeys = Object.keys(FORMATIONS);
        formation = fkeys[Math.floor(r() * fkeys.length)];
      } else if (roll < 0.60) {
        const keys = Object.keys(DATA.EVENTS);
        event = keys[Math.floor(r() * keys.length)];
      }
    }
    const ev = event ? DATA.EVENTS[event] : null;
    if (ev && ev.hpMult) hs *= ev.hpMult;

    // threat budget for this wave (HP scaling carries most difficulty; counts grow gently)
    const rampIn = Math.min(1, 0.7 + wave * 0.15); // first waves are only slightly lighter
    const earlyBoost = 1 + 0.5 * Math.exp(-(level - 1) / 7); // early levels punch harder, fades by ~L15
    const p = Math.max(0, (wave - 1) / Math.max(1, totalWaves - 1));
    const growth = 2.3 + level * 0.17; // total count growth across the level
    let budget = (20 + level * 1.6) * earlyBoost * Math.pow(growth, Math.min(p, 1)) * (0.9 + 0.2 * r()) * rampIn;
    // first-session heat: the opening waves of early levels arrive dense and
    // immediately, so a new player (or a portal reviewer) sees action fast
    if (level <= 3 && wave <= 2) budget *= 1.35;
    if (ev && ev.countMult) budget *= ev.countMult;
    if (isBossWave) budget *= 0.45; // boss itself is the show
    if (wave > totalWaves) budget *= Math.pow(1.13, wave - totalWaves); // endless overtime compounds

    // pool of unlocked enemy types, weighted toward recent unlocks
    let pool = MAPS.unlockedEnemies(level);
    let fdef = formation ? FORMATIONS[formation] : null;
    if (fdef) {
      const sub = pool.filter(id => fdef.match(DATA.ENEMIES[id]));
      if (sub.length >= 1) {
        pool = sub;
        if (fdef.budgetMult) budget *= fdef.budgetMult;
        if (fdef.hpMult) hs *= fdef.hpMult;
      } else { formation = null; fdef = null; }
    }
    const weights = pool.map(id => {
      const e = DATA.ENEMIES[id];
      let w = 1 + 2.4 * Math.exp(-(level - e.unlock) / 6);
      if (e.threat > budget * 0.65) w *= 0.15; // don't blow whole budget on one unit
      return w;
    });

    let t = wave === 1 ? 0.15 : 0.5;
    const gapMult = (level <= 3 && wave <= 2) ? 0.7 : 1;
    const groups = 2 + Math.min(3, Math.floor(wave / 4)) + (budget > 300 ? 1 : 0);
    for (let g = 0; g < groups && budget > 2; g++) {
      const type = UTIL.wchoice(r, pool, weights);
      const e = DATA.ENEMIES[type];
      const share = budget * (0.25 + r() * 0.4);
      let count = Math.max(1, Math.min(26, Math.round(share / e.threat)));
      if (type === 'swarmling') count = Math.min(34, count * 2);
      // specialists (stealth/flying) arrive as squads, never as the whole wave —
      // unless this IS an air raid / phantom ops formation
      const tr = e.traits || {};
      if ((tr.stealth || tr.flying) && !fdef) count = Math.min(count, 3 + Math.floor(wave / 3));
      if (fdef && (tr.stealth || tr.flying)) count = Math.min(count, 9 + Math.floor(wave / 2));
      budget -= count * e.threat;
      const gap = UTIL.clamp(0.9 / e.speed * (e.size + 0.55), 0.26, 0.95) * gapMult;
      for (let i = 0; i < count; i++) {
        events.push({ delay: t, type, hpMult: hs });
        t += gap * (0.85 + r() * 0.3);
      }
      t += 0.8 + r() * 0.6; // short breather between squads
    }

    // mini-boss checkpoints at ~1/3 and ~2/3 of every level
    const mb1 = Math.round(totalWaves * 0.33), mb2 = Math.round(totalWaves * 0.66);
    if (!isBossWave && (wave === mb1 || wave === mb2)) {
      const bigs = pool.filter(id => DATA.ENEMIES[id].threat >= 7);
      const type = bigs.length ? UTIL.wchoice(r, bigs, bigs.map(() => 1)) : pool[pool.length - 1];
      events.push({ delay: t + 1.5, type, hpMult: hs * 4.2, mini: true });
    }

    if (isEliteWave && level >= 2) {
      // final wave of a non-boss level: an elite (fattened) unit closes the show
      const bigs = pool.filter(id => DATA.ENEMIES[id].threat >= 8);
      const type = bigs.length ? UTIL.wchoice(r, bigs, bigs.map(() => 1)) : pool[pool.length - 1];
      events.push({ delay: t + 1, type, hpMult: hs * 2.6, elite: true });
    }

    if (isBossWave) {
      const bossId = DATA.BOSS_LEVELS[level];
      events.push({ delay: t + 2, type: bossId, hpMult: diffDef.hpMult, banner: DATA.ENEMIES[bossId].name });
    }

    // Endless bosses: every 10 overtime waves, re-run a boss with compounding hp
    if (wave > totalWaves && (wave - totalWaves) % 10 === 0) {
      const bossPool = ['boss_kernel', 'boss_botmaster', 'boss_fakeprime', 'boss_overmind', 'boss_agi'];
      const bossId = bossPool[Math.min(bossPool.length - 1, Math.floor((wave - totalWaves) / 10) - 1 + Math.floor(level / 15))];
      events.push({ delay: t + 2, type: bossId, hpMult: diffDef.hpMult * Math.pow(1.5, (wave - totalWaves) / 10), banner: DATA.ENEMIES[bossId].name });
    }

    return {
      events,
      bounty: bountyScale(level, diffDef, p) * (ev && ev.bounty ? ev.bounty : 1),
      event, formation,
    };
  }

  // Preview: which types appear in a wave + any wave event (for the UI)
  function preview(level, wave, totalWaves, diff, forcedFormation) {
    const w = build(level, wave, totalWaves, diff, forcedFormation);
    const seen = {};
    const list = [];
    let hasMini = false, hasBoss = false;
    for (const ev of w.events) {
      if (ev.mini) hasMini = true;
      if (DATA.ENEMIES[ev.type].traits && DATA.ENEMIES[ev.type].traits.boss) hasBoss = true;
      if (!seen[ev.type]) { seen[ev.type] = 0; list.push(ev.type); }
      seen[ev.type]++;
    }
    return { list: list.map(type => ({ type, count: seen[type] })), event: w.event, formation: w.formation, hasMini, hasBoss };
  }

  function waveEndBonus(level, wave) {
    return 18 + level * 2.5 + wave * 2.5;
  }

  return { build, preview, waveEndBonus, hpScale, formationInfo };
})();
</script>
<script>
/* ====================== js/entities.js ====================== */
/* NEURAL SIEGE — Enemy / Tower / Projectile entities. All positions in tile units. */
'use strict';

// ==================================================================== ENEMY
class Enemy {
  constructor(g, type, hpMult, opts) {
    const def = DATA.ENEMIES[type];
    this.g = g;
    this.type = type;
    this.def = def;
    this.traits = def.traits || {};
    this.maxHp = Math.round(def.hp * hpMult);
    this.hp = this.maxHp;
    this.hpMult = hpMult;
    this.baseSpeed = def.speed;
    this.bounty = Math.max(1, Math.round(def.bounty * g.bountyMult));
    if (def.bounty === 0) this.bounty = 0;
    this.dmg = def.dmg;
    this.size = def.size * (opts && opts.elite ? 1.25 : 1);
    this.elite = !!(opts && opts.elite);
    this.flying = !!this.traits.flying;
    this.armor = this.traits.armor || 0; // flat: armor is a mechanic to counter, not a curve
    this.maxShield = this.traits.shield ? Math.round(this.traits.shield * hpMult) : 0;
    this.shield = this.maxShield;
    this.isBoss = !!this.traits.boss;
    // mini-boss checkpoint unit: fattened elite with a boss bar
    if (opts && opts.mini) {
      this.mini = true;
      this.elite = true;
      this.size = Math.min(0.52, def.size * 1.4);
      this.bounty *= 5;
      this.armor += 3;
      this.dmg = Math.min(8, this.dmg * 2);
      this.isBoss = true; // boss bar + stun resistance
      this.displayName = 'ELITE ' + def.name.toUpperCase();
    }

    // position: distance along path (ground) or 0..len line (flying)
    this.dist = (opts && opts.dist) || 0;
    this.wobble = Math.random() * Math.PI * 2;
    this.lane = (Math.random() - 0.5) * 0.34; // lateral offset so units don't stack
    if (this.isBoss) this.lane = 0;

    this.dead = false; this.leaked = false;
    this.stunT = 0; this.slowT = 0; this.slowPct = 0;
    this.dotDps = 0; this.dotT = 0;
    this.noHitT = 0;            // time since last damage (shield regen)
    this.revealT = 0;           // >0 = revealed
    this.phaseHidden = false;   // boss stealth phase
    this.auraSpeed = 0;         // botnet buff applied by game
    this.tpT = this.traits.teleport ? this.traits.teleport.every : 0;
    this.summonT = this.traits.summon ? this.traits.summon.every : 0;
    this.phaseT = this.traits.phaser ? this.traits.phaser.period : 0;
    this.enraged = false;
    this.anim = Math.random() * 10;
    this.walk = Math.random() * 2;  // visual only: tiles travelled, drives leg/tread cycles
    // status effects for tower combos
    this.chilledT = 0; this.shockT = 0; this.burnT = 0; this.critCd = 0;
    // signal jammer state
    this.jamT = this.traits.jam ? this.traits.jam.every : 0;
    this.jammingT = 0; this.jamTarget = null;

    if (this.flying) {
      const p = g.level.path;
      this.fx0 = p[0].x + 0.5; this.fy0 = -0.7;
      this.fx1 = p[p.length - 1].x + 0.5; this.fy1 = p[p.length - 1].y + 0.5;
      this.flyLen = UTIL.dist(this.fx0, this.fy0, this.fx1, this.fy1);
    }
    this.updatePos();
  }

  get stealthed() {
    return ((this.traits.stealth && this.revealT <= 0) || this.phaseHidden);
  }
  get totalLen() { return this.flying ? this.flyLen : this.g.pathLen; }

  updatePos() {
    if (this.flying) {
      const t = UTIL.clamp(this.dist / this.flyLen, 0, 1);
      this.x = UTIL.lerp(this.fx0, this.fx1, t) + Math.sin(this.anim * 3) * 0.12;
      this.y = UTIL.lerp(this.fy0, this.fy1, t);
      this.angle = Math.atan2(this.fy1 - this.fy0, this.fx1 - this.fx0);
      return;
    }
    const path = this.g.level.path;
    const d = UTIL.clamp(this.dist, 0, this.g.pathLen - 0.0001);
    const i = Math.min(path.length - 2, Math.floor(d));
    const f = d - i;
    const ax = path[i].x + 0.5, ay = path[i].y + 0.5;
    const bx = path[i + 1].x + 0.5, by = path[i + 1].y + 0.5;
    const dx = bx - ax, dy = by - ay;
    // lateral lane offset perpendicular to travel
    this.x = UTIL.lerp(ax, bx, f) + dy * this.lane;
    this.y = UTIL.lerp(ay, by, f) - dx * this.lane;
    this.angle = Math.atan2(dy, dx);
  }

  speedNow() {
    if (this.stunT > 0 || this.jammingT > 0) return 0;
    let s = this.baseSpeed * (1 + this.auraSpeed);
    if (this.enraged) s *= 1.6;
    if (!this.traits.slowImmune && !this.flying) {
      let slow = this.slowT > 0 ? this.slowPct : 0;
      slow = Math.max(slow, this.g.auraSlowAt(this.x, this.y));
      if (this.isBoss) slow = Math.min(slow, 0.45);
      if (slow > 0.05) this.chilledT = Math.max(this.chilledT, 0.25); // CHILLED status
      s *= (1 - slow);
    }
    return s;
  }

  update(dt) {
    const g = this.g;
    this.anim += dt;
    this.noHitT += dt;
    if (this.hitT > 0) this.hitT -= dt;
    if (this.stunT > 0) this.stunT -= dt;
    if (this.slowT > 0) this.slowT -= dt;
    if (this.revealT > 0) this.revealT -= dt;
    if (this.chilledT > 0) this.chilledT -= dt;
    if (this.shockT > 0) this.shockT -= dt;
    if (this.burnT > 0) this.burnT -= dt;
    if (this.critCd > 0) this.critCd -= dt;

    // signal jammer: stop and knock the nearest tower offline
    if (this.traits.jam && !this.dead && this.y > 0) {
      if (this.jammingT > 0) {
        this.jammingT -= dt;
        if (this.jamTarget && !this.jamTarget.dead) this.jamTarget.disabledT = 0.35; // refreshed while jamming
        if (this.jammingT <= 0) this.jamTarget = null;
      } else {
        this.jamT -= dt;
        if (this.jamT <= 0) {
          let best = null, bd = this.traits.jam.range * this.traits.jam.range;
          for (const tw of g.towers) {
            if (tw.def.kind === 'income') continue;
            const d2 = UTIL.dist2(this.x, this.y, tw.x, tw.y);
            if (d2 < bd) { bd = d2; best = tw; }
          }
          if (best) {
            this.jamTarget = best;
            this.jammingT = this.traits.jam.dur;
            g.fxRing(this.x, this.y, 0.6, '#ff5252');
            AUDIO.sfx.stun();
          }
          this.jamT = this.traits.jam.every;
        }
      }
    }

    // damage over time
    if (this.dotT > 0) {
      this.dotT -= dt;
      this.hurt(this.dotDps * dt, { silent: true, noArmor: true });
      if (this.dead) return;
    }
    // regen (innate + wave-event bonus)
    const regen = (this.traits.regen || 0) * this.hpMult + (this.regenBonus || 0);
    if (regen > 0 && this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + regen * dt);
    }
    // shield recharge after 2.5s unhit
    if (this.maxShield && this.noHitT > 2.5 && this.shield < this.maxShield) {
      this.shield = Math.min(this.maxShield, this.shield + this.maxShield * 0.25 * dt);
    }
    // teleport
    if (this.traits.teleport && !this.flying) {
      this.tpT -= dt;
      if (this.tpT <= 0) {
        this.tpT = this.traits.teleport.every;
        this.dist = Math.min(this.dist + this.traits.teleport.dist, this.totalLen - 0.05);
        g.fxRing(this.x, this.y, 0.5, '#e1bee7');
      }
    }
    // boss summons
    if (this.traits.summon) {
      this.summonT -= dt;
      if (this.summonT <= 0) {
        this.summonT = this.traits.summon.every;
        for (let i = 0; i < this.traits.summon.count; i++) {
          g.spawnEnemy(this.traits.summon.type, this.hpMult * 0.6, { dist: Math.max(0, this.dist - 0.4 - i * 0.3) });
        }
        g.fxRing(this.x, this.y, 0.7, this.def.color);
      }
    }
    // boss stealth phasing
    if (this.traits.phaser) {
      this.phaseT -= dt;
      const dur = this.traits.phaser.dur;
      this.phaseHidden = this.phaseT < dur && this.revealT <= 0;
      if (this.phaseT <= 0) this.phaseT = this.traits.phaser.period;
    }
    // enrage
    if (this.traits.enrage && !this.enraged && this.hp / this.maxHp < this.traits.enrage) {
      this.enraged = true;
      g.toast(this.def.name + ' IS ENRAGED', 'warn');
    }

    const spd = this.speedNow();
    this.walk += spd * dt;          // visual only: locomotion cycle distance
    this.dist += spd * dt;
    if (this.dist >= this.totalLen) { this.leaked = true; this.dead = true; return; }
    this.updatePos();
  }

  // returns damage actually dealt
  hurt(amount, opts) {
    if (this.dead) return 0;
    opts = opts || {};
    this.noHitT = 0;
    let dmg = amount;
    // damage type matchups: weakness +30%, resistance -30%
    if (opts.dtype) {
      if (this.def.weak === opts.dtype) dmg *= 1.3;
      else if (this.def.resist === opts.dtype) dmg *= 0.7;
    }
    // SHOCKED enemies take +25%
    if (this.shockT > 0) dmg *= 1.25;
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, dmg);
      this.shield -= absorbed;
      dmg -= absorbed;
      if (dmg <= 0) return absorbed;
    }
    if (this.armor && !opts.pierce && !opts.noArmor) {
      dmg = Math.max(amount * 0.1, dmg - this.armor);
    }
    this.hp -= dmg;
    this.hitT = 0.12; // visual hit-pop
    if (this.hp <= 0) { this.dead = true; this.g.onEnemyKilled(this, opts.source); }
    return dmg;
  }

  applySlow(pct, dur) {
    if (this.traits.slowImmune || this.flying) return;
    if (pct >= this.slowPct || this.slowT <= 0) { this.slowPct = pct; this.slowT = dur; }
  }
  applyDot(dps, dur) {
    if (dps >= this.dotDps || this.dotT <= 0) { this.dotDps = dps; this.dotT = dur; }
  }
  applyStun(dur) {
    if (this.isBoss) { this.slowPct = Math.max(this.slowPct, 0.5); this.slowT = Math.max(this.slowT, dur); return; }
    this.stunT = Math.max(this.stunT, dur);
  }
}

// ==================================================================== TOWER
class Tower {
  constructor(g, type, gx, gy) {
    this.g = g;
    this.type = type;
    this.def = DATA.TOWERS[type];
    this.gx = gx; this.gy = gy;
    this.x = gx + 0.5; this.y = gy + 0.5;
    this.tier = 0;
    this.branch = null;                    // tier-IV specialization index (0/1)
    this.invested = 0;
    this.cool = 0;
    this.aim = -Math.PI / 2;
    this.targetMode = 'first';
    this.buffDmg = 0; this.buffRate = 0;   // from overclockers, recomputed on tower changes
    this.beamTarget = null; this.beamRamp = 1;
    this.anim = Math.random() * 10;
    this.kills = 0;
    this.flashT = 0; this.recoil = 0;      // muzzle flash / recoil juice
    this.disabledT = 0;                    // blackout event
  }

  stats() {
    const lv = this.def.levels[this.tier];
    const g = this.g;
    let dmg = lv.dmg, rate = lv.rate, range = lv.range;
    let slow = lv.slow || 0, splash = lv.splash || 0, chains = lv.chains || 0;
    let stun = lv.stun || 0, income = lv.income || 0;
    let buffDmgOut = lv.buffDmg || 0, buffRateOut = lv.buffRate || 0;
    let rampMax = 2.5, pierce = !!this.def.pierce, burn = false, interest = 0;

    if (this.tier === 3 && this.branch !== null && DATA.BRANCHES[this.type]) {
      const m = DATA.BRANCHES[this.type][this.branch].mods;
      if (m.dmg) dmg *= m.dmg;
      if (m.rate) rate *= m.rate;
      if (m.range) range *= m.range;
      if (m.splash) splash *= m.splash;
      if (m.income) income = Math.round(income * m.income);
      if (m.slowAdd) slow += m.slowAdd;
      if (m.chainsAdd) chains += m.chainsAdd;
      if (m.stunAdd) stun += m.stunAdd;
      if (m.buffDmgAdd) buffDmgOut += m.buffDmgAdd;
      if (m.buffRateAdd) buffRateOut += m.buffRateAdd;
      if (m.rampMax) rampMax = m.rampMax;
      if (m.pierce) pierce = true;
      if (m.burn) burn = true;
      if (m.interest) interest = m.interest;
    }
    // protocol chips
    if (g.chipHas) {
      if (g.chipHas('ap_rounds') && (this.type === 'sentry' || this.type === 'scanner')) dmg *= 1.3;
      if (g.chipHas('storm_coil') && chains) chains += 2;
      if (g.chipHas('cryo') && slow) slow += 0.12;
      if (g.chipHas('longshot') && this.type === 'sniper') range += 1.5;
      if (g.chipHas('harvest')) income = Math.round(income * 1.4);
      if (g.chipHas('napalm') && this.type === 'mortar') burn = true;
    }
    // terrain bonuses
    const tile = g.tileAt ? g.tileAt(this.gx, this.gy) : null;
    if (tile === 'hill') range += 1;
    const surge = g.surgeT > 0;
    let fw = 1 + SAVE.researchValue('firmware') / 100 + this.buffDmg + (surge ? 0.8 : 0);
    if (tile === 'power') fw *= 1.25;
    let rr = 1 + SAVE.researchValue('overclockr') / 100 + this.buffRate + (surge ? 0.3 : 0);
    if (g.chipHas && g.chipHas('overvolt')) rr += 0.10;
    return {
      dmg: dmg * fw, rate: rate * rr, range,
      slow: Math.min(0.8, slow), splash, chains, stun, income,
      rampMax, pierce, burn, interest,
      buffDmg: buffDmgOut, buffRate: buffRateOut,
    };
  }

  // roll a crit for one shot: returns {dmg, crit}. CHILLED targets guarantee one.
  rollHit(baseDmg, target) {
    if (target && target.chilledT > 0 && target.critCd <= 0) {
      target.critCd = 1.5;
      return { dmg: baseDmg * 2.2, crit: true };
    }
    const chance = 0.08 + (this.g.chipHas && this.g.chipHas('deadeye') ? 0.12 : 0);
    if (Math.random() < chance) return { dmg: baseDmg * 2.2, crit: true };
    return { dmg: baseDmg, crit: false };
  }

  fireJuice() { this.flashT = 0.07; this.recoil = 1; }

  inRange(e, range) {
    return UTIL.dist2(this.x, this.y, e.x, e.y) <= (range + e.size) * (range + e.size);
  }
  canTarget(e) {
    if (e.dead || e.stealthed) return false;
    if (e.flying && !this.def.air) return false;
    if (e.y < -0.2) return false;
    return true;
  }

  pickTarget(range) {
    const g = this.g;
    let best = null, bestV = -Infinity;
    for (const e of g.enemies) {
      if (!this.canTarget(e) || !this.inRange(e, range)) continue;
      let v;
      switch (this.targetMode) {
        case 'last':   v = -(e.dist / e.totalLen); break;
        case 'strong': v = e.hp; break;
        case 'close':  v = -UTIL.dist2(this.x, this.y, e.x, e.y); break;
        default:       v = e.dist / e.totalLen + (e.isBoss ? 10 : 0); break; // first
      }
      if (v > bestV) { bestV = v; best = e; }
    }
    return best;
  }

  update(dt) {
    const g = this.g;
    this.anim += dt;
    if (this.flashT > 0) this.flashT -= dt;
    if (this.recoil > 0) this.recoil *= Math.pow(0.0001, dt); // fast decay
    if (this.disabledT > 0) { this.disabledT -= dt; return; } // blackout event
    const s = this.stats();
    this.cool -= dt;

    switch (this.def.kind) {
      case 'bullet': {
        if (this.cool > 0) break;
        const t = this.pickTarget(s.range);
        if (!t) break;
        this.aim = Math.atan2(t.y - this.y, t.x - this.x);
        this.cool = 1 / s.rate;
        const h = this.rollHit(s.dmg, t);
        g.projectiles.push(new Projectile(g, this, t, { dmg: h.dmg, crit: h.crit, pierce: s.pierce, dtype: this.def.dtype, speed: 11, color: this.def.color, kind: 'bullet' }));
        this.fireJuice();
        if (this.type === 'scanner') AUDIO.sfx.scan(); else AUDIO.sfx.shot();
        break;
      }
      case 'snipe': {
        if (this.cool > 0) break;
        const t = this.pickTarget(s.range);
        if (!t) break;
        this.aim = Math.atan2(t.y - this.y, t.x - this.x);
        this.cool = 1 / s.rate;
        const h = this.rollHit(s.dmg, t);
        t.hurt(h.dmg, { pierce: s.pierce, dtype: this.def.dtype, source: this });
        if (h.crit) g.fxText(t.x, t.y, Math.round(h.dmg), '#ffd166', true);
        g.fxLine(this.x, this.y, t.x, t.y, this.def.color, 0.14);
        g.fxHit(t.x, t.y, this.def.color, 6);
        this.fireJuice();
        AUDIO.sfx.snipe();
        break;
      }
      case 'chain': {
        if (this.cool > 0) break;
        const first = this.pickTarget(s.range);
        if (!first) break;
        this.aim = Math.atan2(first.y - this.y, first.x - this.x);
        this.cool = 1 / s.rate;
        const h = this.rollHit(s.dmg, first);
        let prev = { x: this.x, y: this.y };
        let cur = first, dmg = h.dmg;
        const hitSet = new Set();
        for (let i = 0; i < s.chains && cur; i++) {
          g.fxLine(prev.x, prev.y, cur.x, cur.y, this.def.color, 0.12, true);
          cur.hurt(dmg, { dtype: this.def.dtype, source: this });
          cur.shockT = Math.max(cur.shockT, 2); // SHOCKED
          if (h.crit && i === 0) g.fxText(cur.x, cur.y, Math.round(dmg), '#ffd166', true);
          g.fxHit(cur.x, cur.y, this.def.color, 3);
          hitSet.add(cur);
          prev = cur;
          dmg *= 0.75;
          // nearest unhit target within 2 tiles of last strike
          let nxt = null, nd = 4;
          for (const e of g.enemies) {
            if (hitSet.has(e) || !this.canTarget(e)) continue;
            const d2 = UTIL.dist2(prev.x, prev.y, e.x, e.y);
            if (d2 < nd) { nd = d2; nxt = e; }
          }
          cur = nxt;
        }
        this.fireJuice();
        AUDIO.sfx.chain();
        break;
      }
      case 'splash': {
        if (this.cool > 0) break;
        const t = this.pickTarget(s.range);
        if (!t) break;
        this.aim = Math.atan2(t.y - this.y, t.x - this.x);
        this.cool = 1 / s.rate;
        // lead the target slightly
        const lead = UTIL.clamp(t.speedNow() * 0.45, 0, 0.9);
        const tx = t.x + Math.cos(t.angle) * lead, ty = t.y + Math.sin(t.angle) * lead;
        const h = this.rollHit(s.dmg, t);
        g.projectiles.push(new Projectile(g, this, null, {
          dmg: h.dmg, crit: h.crit, speed: 6.5, color: this.def.color, kind: 'mortar',
          destX: tx, destY: ty, splash: s.splash, arc: true, burn: s.burn, dtype: this.def.dtype,
        }));
        this.fireJuice();
        AUDIO.sfx.shot();
        break;
      }
      case 'orb': {
        if (this.cool > 0) break;
        const t = this.pickTarget(s.range);
        if (!t) break;
        this.aim = Math.atan2(t.y - this.y, t.x - this.x);
        this.cool = 1 / s.rate;
        const h = this.rollHit(s.dmg, t);
        g.projectiles.push(new Projectile(g, this, t, {
          dmg: h.dmg, crit: h.crit, speed: 5.5, color: this.def.color, kind: 'orb', splash: s.splash, air: true, dtype: this.def.dtype,
        }));
        this.fireJuice();
        AUDIO.sfx.orb();
        break;
      }
      case 'beam': {
        // keep / acquire lock
        if (this.beamTarget && (this.beamTarget.dead || this.beamTarget.stealthed || !this.inRange(this.beamTarget, s.range))) {
          this.beamTarget = null; this.beamRamp = 1;
        }
        if (!this.beamTarget) {
          this.beamTarget = this.pickTarget(s.range);
          this.beamRamp = 1;
        }
        if (this.beamTarget) {
          const t = this.beamTarget;
          this.aim = Math.atan2(t.y - this.y, t.x - this.x);
          this.beamRamp = Math.min(s.rampMax, this.beamRamp + dt * 0.55);
          t.hurt(s.dmg * this.beamRamp * dt, { dtype: this.def.dtype, source: this });
          AUDIO.sfx.beam();
        }
        break;
      }
      case 'field': {
        if (this.cool > 0) break;
        this.cool = 1 / s.rate;
        let hit = false;
        for (const e of this.g.enemies) {
          if (e.dead || e.flying || e.y < 0) continue;
          if (this.inRange(e, s.range)) {
            e.hurt(s.dmg / s.rate, { source: this, noArmor: true });
            e.applySlow(s.slow, 0.65);
            hit = true;
          }
        }
        if (hit) this.pulseT = 0.4;
        break;
      }
      case 'emp': {
        if (this.cool > 0) break;
        // only fire when something is in range
        let any = false;
        for (const e of g.enemies) { if (!e.dead && e.y > 0 && this.inRange(e, s.range)) { any = true; break; } }
        if (!any) break;
        this.cool = 1 / s.rate;
        for (const e of g.enemies) {
          if (e.dead || e.y < 0 || !this.inRange(e, s.range)) continue;
          e.hurt(s.dmg, { dtype: this.def.dtype, source: this, noArmor: true });
          if (!e.dead) { e.applyStun(s.stun); e.shockT = Math.max(e.shockT, 2); }
        }
        g.fxRing(this.x, this.y, s.range, this.def.color);
        g.shake(3);
        AUDIO.sfx.empPulse();
        break;
      }
      // slowaura / buffaura / income: passive
    }
    if (this.pulseT > 0) this.pulseT -= dt;
  }

  upgradeCost() {
    if (this.tier >= 3) return null;
    const c = this.def.levels[this.tier + 1].cost;
    return Math.round(c * (1 - SAVE.researchValue('discount') / 100));
  }
  sellValue() {
    return Math.round(this.invested * (0.70 + SAVE.researchValue('salvage') / 100));
  }
}

// =============================================================== PROJECTILE
class Projectile {
  constructor(g, source, target, opts) {
    this.g = g;
    this.source = source;
    this.target = target;
    this.x = source.x; this.y = source.y - 0.18;
    this.dmg = opts.dmg;
    this.crit = !!opts.crit;
    this.pierce = !!opts.pierce;
    this.dtype = opts.dtype || null;
    this.burn = !!opts.burn;
    this.speed = opts.speed;
    this.color = opts.color;
    this.kind = opts.kind;
    this.splash = opts.splash || 0;
    this.air = !!opts.air;
    this.arc = !!opts.arc;
    this.dead = false;
    if (target) { this.destX = target.x; this.destY = target.y; }
    else { this.destX = opts.destX; this.destY = opts.destY; }
    this.totalDist = Math.max(0.001, UTIL.dist(this.x, this.y, this.destX, this.destY));
    this.traveled = 0;
  }

  update(dt) {
    const g = this.g;
    // homing: track live target
    if (this.target && !this.target.dead) { this.destX = this.target.x; this.destY = this.target.y; }
    const dx = this.destX - this.x, dy = this.destY - this.y;
    const d = Math.hypot(dx, dy);
    const step = this.speed * dt;
    this.traveled += step;

    if (d <= step + 0.05) {
      this.x = this.destX; this.y = this.destY;
      this.impact();
      return;
    }
    this.x += dx / d * step;
    this.y += dy / d * step;
    this.angle = Math.atan2(dy, dx);
    if (this.traveled > 30) this.dead = true; // safety
  }

  impact() {
    const g = this.g;
    this.dead = true;
    if (this.kind === 'mortar' || (this.kind === 'orb' && this.splash)) {
      // area damage
      const r = this.splash;
      for (const e of g.enemies) {
        if (e.dead || e.y < 0) continue;
        if (e.flying && this.kind === 'mortar') continue;
        if (UTIL.dist2(this.x, this.y, e.x, e.y) <= (r + e.size) * (r + e.size)) {
          e.hurt(this.dmg, { dtype: this.dtype, source: this.source });
        }
      }
      if (this.crit) g.fxText(this.x, this.y, Math.round(this.dmg), '#ffd166', true);
      if (this.burn) g.addBurn(this.x, this.y, r * 0.85, this.dmg * 0.22, 3);
      g.fxBoom(this.x, this.y, r, this.color);
      AUDIO.sfx.boom();
      if (this.kind === 'mortar') g.shake(2);
    } else {
      // single hit
      if (this.target && !this.target.dead) {
        this.target.hurt(this.dmg, { pierce: this.pierce, dtype: this.dtype, source: this.source });
        if (this.crit) g.fxText(this.x, this.y, Math.round(this.dmg), '#ffd166', true);
        g.fxHit(this.x, this.y, this.color, 3);
      }
    }
  }
}
